<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🔒%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #e4f0f1; color: #10263a; }
    h1, h2, h3, .disp { font-family: 'Bricolage Grotesque', sans-serif; }
    .inp { width: 100%; border: 2px solid #c5d8dc; border-radius: 12px; padding: 10px 12px; background: #fff; }
    .inp:focus { outline: 3px solid #ff5a36; border-color: #ff5a36; }
    .btn { background: #ff5a36; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 18px; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .btn:hover { background: #e84823; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn2 { background: #10263a; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 18px; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 2px 0 #c5d8dc; }
    th { text-align: left; padding: 6px 8px; font-weight: 700; }
    td { padding: 6px 8px; border-top: 1px solid #e4f0f1; vertical-align: top; }
  </style>
</head>
<body>
  <header class="bg-[#10263a] text-white">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <span class="disp font-extrabold text-xl">🔒 Administración · Feria Virtual</span>
      <button id="logoutBtn" type="button" class="px-3 py-2 font-bold hidden" onclick="logout()">Salir</button>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 py-6"><p class="card">Cargando…</p></main>
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#10263a] text-white px-4 py-2 rounded-xl hidden z-50 max-w-[90vw] text-center"></div>

  <script>
    const $ = s => document.querySelector(s);
    const app = $('#app');
    const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });
    const toast = m => {
      const t = $('#toast');
      t.textContent = m;
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
    };

    let tab = 'stands';

    function loginView(msg) {
      app.innerHTML = `
        <form class="card max-w-md mx-auto space-y-3" onsubmit="login(event)">
          <h1 class="text-2xl font-extrabold">Acceso de administrador</h1>
          ${msg ? `<p class="text-red-600 font-bold">${h(msg)}</p>` : ''}
          <input class="inp" type="email" name="email" placeholder="Email" required>
          <input class="inp" type="password" name="password" placeholder="Clave" required>
          <button id="loginBtn" class="btn w-full">Entrar</button>
        </form>`;
    }

    window.login = async e => { e.preventDefault(); };
    window.logout = async () => { loginView(); };
    window.setActive = async (id, active) => {};

    // Vista inicial limpia con toda la estructura visual lista
    loginView();
  </script>
</body>
</html>
