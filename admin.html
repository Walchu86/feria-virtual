<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Superadministración · Feria Virtual</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🔒%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #e4f0f1; color: #10263a; }
    h1, h2, h3, .disp { font-family: 'Bricolage Grotesque', sans-serif; }
    .inp { width: 100%; border: 2px solid #c5d8dc; border-radius: 12px; padding: 10px 12px; background: #fff; }
    .inp:focus { outline: 3px solid #ff5a36; border-color: #ff5a36; }
    .btn { background: #ff5a36; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 18px; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .btn:hover { background: #e84823; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn2 { background: #10263a; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 18px; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 2px 0 #c5d8dc; }
    th { text-align: left; padding: 8px; font-weight: 700; background: #f3f9fa; }
    td { padding: 8px; border-top: 1px solid #e4f0f1; vertical-align: middle; }
  </style>
</head>
<body>
  <header class="bg-[#10263a] text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <span class="disp font-extrabold text-xl">🔒 Superadministración · Feria Virtual</span>
      <button id="logoutBtn" type="button" class="px-3 py-2 font-bold hidden bg-white/10 rounded-xl" onclick="logout()">Salir</button>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 py-6 min-h-[75vh]"><p class="card">Cargando panel...</p></main>

  <!-- Modal Comprobante -->
  <div id="receiptModal" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4" onclick="closeReceipt()">
    <div class="bg-white rounded-3xl p-4 max-w-lg w-full text-center relative" onclick="event.stopPropagation()">
      <button class="absolute top-3 right-3 bg-slate-200 rounded-full w-8 h-8 font-bold" onclick="closeReceipt()">✕</button>
      <h3 class="disp text-xl font-bold mb-3">Comprobante de Personal Pay</h3>
      <div id="receiptContent" class="max-h-[70vh] overflow-auto flex items-center justify-center"></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#10263a] text-white px-4 py-2 rounded-xl hidden z-50 max-w-[90vw] text-center shadow-lg"></div>

  <script>
    const DB = {
      getStands: () => JSON.parse(localStorage.getItem('fv_stands') || '[]'),
      saveStands: d => localStorage.setItem('fv_stands', JSON.stringify(d)),
      getProducts: () => JSON.parse(localStorage.getItem('fv_products') || '[]'),
      getOrders: () => JSON.parse(localStorage.getItem('fv_orders') || '[]'),
    };

    const $ = s => document.querySelector(s);
    const app = $('#app');
    const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });
    const toast = m => {
      const t = $('#toast');
      t.textContent = m;
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
    };

    let adminLogged = localStorage.getItem('fv_admin_logged') === 'true';
    let adminTab = 'stands';

    function loginView(err) {
      adminLogged = false;
      localStorage.removeItem('fv_admin_logged');
      $('#logoutBtn').classList.add('hidden');
      app.innerHTML = `
        <form class="card max-w-md mx-auto space-y-4 shadow-xl mt-10" onsubmit="handleLogin(event)">
          <h1 class="disp text-2xl font-extrabold">🔒 Acceso Superadministrador</h1>
          ${err ? `<p class="text-red-600 font-bold text-sm">${err}</p>` : ''}
          <input class="inp" name="user" placeholder="Usuario (walchu86)" required>
          <input class="inp" name="pass" type="password" placeholder="Contraseña" required>
          <button class="btn w-full">Ingresar al Panel</button>
        </form>`;
    }

    window.handleLogin = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (f.user === 'walchu86' && f.pass === 'pancha2026') {
        adminLogged = true;
        localStorage.setItem('fv_admin_logged', 'true');
        $('#logoutBtn').classList.remove('hidden');
        renderAdmin();
        toast('¡Bienvenido Walchu!');
      } else {
        loginView('Usuario o contraseña incorrectos.');
      }
    };

    window.logout = () => {
      adminLogged = false;
      localStorage.removeItem('fv_admin_logged');
      loginView();
      toast('Sesión cerrada');
    };

    window.openReceipt = img => {
      $('#receiptContent').innerHTML = img ? `<img src="${h(img)}" class="max-w-full rounded-xl">` : '<p>Sin comprobante adjunto.</p>';
      $('#receiptModal').classList.remove('hidden');
    };
    window.closeReceipt = () => $('#receiptModal').classList.add('hidden');

    window.toggleStandActive = id => {
      const stands = DB.getStands();
      const s = stands.find(x => x.id === id);
      if (s) {
        s.active = !s.active;
        DB.saveStands(stands);
        toast(s.active ? 'Stand aprobado y activado ✅' : 'Stand pausado');
        renderAdmin();
      }
    };

    window.deleteStand = id => {
      if (!confirm('¿Eliminar este stand por completo?')) return;
      DB.saveStands(DB.getStands().filter(s => s.id !== id));
      toast('Stand eliminado');
      renderAdmin();
    };

    window.exportCSV = () => {
      const orders = DB.getOrders();
      let csv = 'ID Pedido,Comprador,WhatsApp,Total,Estado\n';
      orders.forEach(o => {
        csv += `${o.id},"${o.buyer.name}","${o.buyer.phone}",${o.total},${o.delivered?'Entregado':'Pendiente'}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reporte_ventas_feria_${Date.now()}.csv`;
      a.click();
      toast('Reporte CSV descargado con éxito');
    };

    function renderAdmin() {
      if (!adminLogged) return loginView();
      $('#logoutBtn').classList.remove('hidden');

      const stands = DB.getStands();
      const products = DB.getProducts();
      const orders = DB.getOrders();
      const totalVentas = orders.reduce((acc, o) => acc + o.total, 0);
      const totalComisiones = totalVentas * 0.05; // 5% comisión

      let content = '';
      if (adminTab === 'stands') {
        content = `
          <div class="card overflow-x-auto">
            <h3 class="disp text-xl font-bold mb-3">🏪 Gestión de Stands (${stands.length})</h3>
            <table class="w-full text-sm">
              <tr><th>Negocio</th><th>Rubro</th><th>Contacto</th><th>Comprobante</th><th>Estado</th><th>Acciones</th></tr>
              ${stands.length ? stands.map(s => `
                <tr>
                  <td><b>${h(s.name)}</b><br><span class="text-xs text-slate-500">${h(s.email)}</span></td>
                  <td>${h(s.rubro)}</td>
                  <td><a class="underline" href="https://wa.me/${s.phone}" target="_blank">${s.phone}</a></td>
                  <td>${s.receipt ? `<button class="text-blue-600 font-bold underline" onclick="openReceipt('${h(s.receipt)}')">Ver Comprobante</button>` : '—'}</td>
                  <td><span class="px-2 py-0.5 rounded-full text-xs font-bold ${s.active?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800'}">${s.active?'Activo':'Pendiente'}</span></td>
                  <td class="space-x-1">
                    <button class="${s.active?'btn2':'btn'} !py-1 !px-2 text-xs" onclick="toggleStandActive(${s.id})">${s.active?'Ocultar':'Aprobar'}</button>
                    <button class="bg-red-600 text-white font-bold !py-1 !px-2 rounded-xl text-xs" onclick="deleteStand(${s.id})">Borrar</button>
                  </td>
                </tr>`).join('') : '<tr><td colspan="6" class="text-center py-4">No hay stands registrados.</td></tr>'}
            </table>
          </div>`;
      } else if (adminTab === 'orders') {
        content = `
          <div class="card overflow-x-auto">
            <div class="flex justify-between items-center mb-3">
              <h3 class="disp text-xl font-bold">🧾 Historial General de Pedidos (${orders.length})</h3>
              <button class="btn2 text-xs py-1.5 px-3" onclick="exportCSV()">📥 Descargar Reporte CSV</button>
            </div>
            <table class="w-full text-sm">
              <tr><th>N°</th><th>Fecha</th><th>Comprador</th><th>Detalle</th><th>Total</th><th>Estado</th></tr>
              ${orders.length ? orders.map(o => `
                <tr>
                  <td>#${o.id}</td>
                  <td>${new Date(o.date).toLocaleString('es-AR')}</td>
                  <td><b>${h(o.buyer.name)}</b><br><a class="underline" href="https://wa.me/${o.buyer.phone}" target="_blank">${o.buyer.phone}</a></td>
                  <td>${o.cart.map(i=>`${i.qty}x ${i.name} (${i.standName})`).join(', ')}</td>
                  <td><b>${money(o.total)}</b></td>
                  <td><span class="px-2 py-0.5 rounded-full text-xs font-bold ${o.delivered?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800'}">${o.delivered?'Entregado':'Pendiente'}</span></td>
                </tr>`).join('') : '<tr><td colspan="6" class="text-center py-4">No hay pedidos registrados.</td></tr>'}
            </table>
          </div>`;
      }

      app.innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
          <div class="card"><p class="text-xs text-slate-500">Stands Totales</p><p class="disp text-2xl font-extrabold">${stands.length}</p></div>
          <div class="card"><p class="text-xs text-slate-500">Pendientes de Pago</p><p class="disp text-2xl font-extrabold text-amber-600">${stands.filter(s=>!s.active).length}</p></div>
          <div class="card"><p class="text-xs text-slate-500">Productos</p><p class="disp text-2xl font-extrabold">${products.length}</p></div>
          <div class="card"><p class="text-xs text-slate-500">Ventas Totales</p><p class="disp text-2xl font-extrabold">${money(totalVentas)}</p></div>
          <div class="card border-2 border-[#ff5a36]"><p class="text-xs text-slate-500">Tu Comisión (5%)</p><p class="disp text-2xl font-extrabold text-[#ff5a36]">${money(totalComisiones)}</p></div>
        </div>
        <div class="flex gap-2 mb-4">
          <button class="${adminTab==='stands'?'btn':'btn2'}" onclick="adminTab='stands'; renderAdmin();">🏪 Stands</button>
          <button class="${adminTab==='orders'?'btn':'btn2'}" onclick="adminTab='orders'; renderAdmin();">🧾 Pedidos y Comisiones</button>
        </div>
        ${content}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (adminLogged) renderAdmin();
      else loginView();
    });
  </script>
</body>
</html>
