  <style>
    body { font-family: 'DM Sans', sans-serif; background: #e4f0f1; color: #10263a; overflow-x: hidden; }

    @keyframes pulse-skeleton { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  <!-- FIREBASE FIRESTORE INTEGRACIÓN ROBUSTA CON MODO OFFLINE Y ESCRITURAS ATÓMICAS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQgmq6xVihzWN-f0LbzlzZrSecYeEnjs",
      authDomain: "feria-virtual-shop.firebaseapp.com",
      projectId: "feria-virtual-shop",
      storageBucket: "feria-virtual-shop.firebasestorage.app",
      messagingSenderId: "566189255248",
      appId: "1:566189255248:web:5a44efcol1e4cb8ad3c355"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let memoryStands = JSON.parse(localStorage.getItem('fv_cache_stands') || '[]');
    let memoryProducts = JSON.parse(localStorage.getItem('fv_cache_products') || '[]');
    let memoryOrders = JSON.parse(localStorage.getItem('fv_cache_orders') || '[]');
    let memoryReviews = JSON.parse(localStorage.getItem('fv_cache_reviews') || '[]');

    const slugify = (str) => (str || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

    async function fetchCloudData() {
      try {
        const standsSnap = await getDocs(collection(db, 'stands'));
        memoryStands = standsSnap.docs.map(d => {
          let data = d.data();
          if (!data.slug && data.name) data.slug = slugify(data.name);
          return data;
        });
        localStorage.setItem('fv_cache_stands', JSON.stringify(memoryStands));

        const prodsSnap = await getDocs(collection(db, 'products'));
        memoryProducts = prodsSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_products', JSON.stringify(memoryProducts));

        const ordersSnap = await getDocs(collection(db, 'orders'));
        memoryOrders = ordersSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_orders', JSON.stringify(memoryOrders));

        const reviewsSnap = await getDocs(collection(db, 'reviews'));
        memoryReviews = reviewsSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_reviews', JSON.stringify(memoryReviews));
      } catch (err) {
        console.warn("Modo offline activo:", err);
      }
      if (typeof window.route === 'function') window.route();
    }

    fetchCloudData();

    window.CloudDB = {
      getStands: () => memoryStands,
      saveStand: async (stand) => {
        if (!stand.slug && stand.name) stand.slug = slugify(stand.name);
        const idx = memoryStands.findIndex(s => s.id === stand.id);
        if (idx >= 0) memoryStands[idx] = stand; else memoryStands.push(stand);
        localStorage.setItem('fv_cache_stands', JSON.stringify(memoryStands));
        await setDoc(doc(db, 'stands', String(stand.id)), stand);
      },
      removeStand: async (id) => {
        memoryStands = memoryStands.filter(s => s.id !== id);
        localStorage.setItem('fv_cache_stands', JSON.stringify(memoryStands));
        try { await deleteDoc(doc(db, 'stands', String(id))); } catch(e){}
      },
      getProducts: () => memoryProducts,
      saveProduct: async (prod) => {
        const idx = memoryProducts.findIndex(p => p.id === prod.id);
        if (idx >= 0) memoryProducts[idx] = prod; else memoryProducts.push(prod);
        localStorage.setItem('fv_cache_products', JSON.stringify(memoryProducts));
        await setDoc(doc(db, 'products', String(prod.id)), prod);
      },
      removeProduct: async (id) => {
        memoryProducts = memoryProducts.filter(p => p.id !== id);
        localStorage.setItem('fv_cache_products', JSON.stringify(memoryProducts));
        try { await deleteDoc(doc(db, 'products', String(id))); } catch(e){}
      },
      getOrders: () => memoryOrders,
      saveOrder: async (order) => {
        memoryOrders.push(order);
        localStorage.setItem('fv_cache_orders', JSON.stringify(memoryOrders));
        await setDoc(doc(db, 'orders', String(order.id)), order);
      },
      getReviews: () => memoryReviews,
      saveReview: async (review) => {
        if (!review.id) review.id = Date.now();
        memoryReviews.push(review);
        localStorage.setItem('fv_cache_reviews', JSON.stringify(memoryReviews));
        await setDoc(doc(db, 'reviews', String(review.id)), review);
      },
      removeReview: async (id) => {
        memoryReviews = memoryReviews.filter(r => r.id !== id);
        localStorage.setItem('fv_cache_reviews', JSON.stringify(memoryReviews));
        try { await deleteDoc(doc(db, 'reviews', String(id))); } catch(e){}
      },
      refresh: fetchCloudData
    };
  </script>
</head>

    <p class="text-slate-400 mt-1">Conectando emprendedores y compradores locales.</p>
    <a href="https://wa.me/5493794655867?text=Hola%20Walchu,%20necesito%20soporte%20con%20la%20Feria%20Virtual" target="_blank" class="inline-block mt-3 bg-white/10 px-3 py-1.5 rounded-full hover:bg-white/20">💬 Soporte Técnico con Walchu</a>
  </footer>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#10263a] text-white px-4 py-2 rounded-xl hidden z-50 max-w-[90vw] text-center shadow-lg text-sm"></div>

  <script>
    const ADMIN_WHATSAPP = '5493794655867';
    const CLOUD_NAME = 'xr6zpe1k';
    const UPLOAD_PRESET = 'feria_preset';

    const slugify = (str) => (str || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const cleanPhoneNumber = (raw) => {
      let digits = (raw || '').replace(/\D/g, '');
      if (digits.startsWith('549') && digits.length > 10) digits = digits.slice(3);
      else if (digits.startsWith('54') && digits.length > 10) digits = digits.slice(2);
      if (digits.startsWith('0')) digits = digits.slice(1);
      return digits;
    };

    const optimizeCloudinaryUrl = (url) => (!url || !url.includes('cloudinary.com')) ? url : url.replace('/upload/', '/upload/f_auto,q_auto/');

    const uploadToCloudinary = async (file) => {
      if (!file) return '';
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!data.secure_url) throw new Error('Falló la subida de imagen');
      return optimizeCloudinaryUrl(data.secure_url);
    };

    const DB = {
      getStands: () => window.CloudDB ? window.CloudDB.getStands() : [],
      saveStand: async s => { if(window.CloudDB) await window.CloudDB.saveStand(s); },
      removeStand: async id => { if(window.CloudDB) await window.CloudDB.removeStand(id); },
      getProducts: () => window.CloudDB ? window.CloudDB.getProducts() : [],
      saveProduct: async p => { if(window.CloudDB) await window.CloudDB.saveProduct(p); },
      removeProduct: async id => { if(window.CloudDB) await window.CloudDB.removeProduct(id); },
      getOrders: () => window.CloudDB ? window.CloudDB.getOrders() : [],
      saveOrder: async o => { if(window.CloudDB) await window.CloudDB.saveOrder(o); },
      getReviews: () => window.CloudDB ? window.CloudDB.getReviews() : [],
      saveReview: async r => { if(window.CloudDB) await window.CloudDB.saveReview(r); },
      removeReview: async id => { if(window.CloudDB) await window.CloudDB.removeReview(id); },
      refresh: () => { if(window.CloudDB) window.CloudDB.refresh(); }
    };

    const $ = s => document.querySelector(s);
    const app = $('#app');
    const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });

    const parsePrice = (val) => {
      if (!val) return 0;
      let s = String(val).trim().replace(/\./g, '').replace(',', '.');
      let num = Number(s) || 0;
      if (num > 0 && num < 10) num *= 10000;
      else if (num >= 10 && num < 1000) num *= 1000;
      return num;
    };

    const finalPrice = p => Math.round(Number(p.price) * (1 - (Number(p.discount) || 0) / 100));
    const toast = m => {
      const t = $('#toast');
      t.textContent = m;
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
    };

    let cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
    let currentVendor = JSON.parse(localStorage.getItem('fv_session') || 'null');

    const saveCart = () => { localStorage.setItem('fv_cart', JSON.stringify(cart)); renderNav(); };

    function renderNav() {
      const totalItems = cart.reduce((acc, i) => acc + i.qty, 0);
      const totalPrice = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      $('#nav').innerHTML = `
        <button type="button" onclick="toggleCart(true)" class="px-2 py-1.5 rounded-xl bg-white/10 flex items-center gap-1 text-xs">
          🛒 (${totalItems}) <span class="hidden md:inline">${money(totalPrice)}</span>
        </button>` +
        (currentVendor 
          ? `<button type="button" onclick="navigate('#/panel')" class="px-3 py-1.5 rounded-xl bg-[#ff5a36] text-xs font-bold">Mi Stand</button>
             <button type="button" onclick="logout()" class="px-1 py-1.5 opacity-80 text-xs">Salir</button>`
          : `<button type="button" onclick="navigate('#/ingresar')" class="px-2 py-1.5 text-xs">Vendedor</button>
             <button type="button" onclick="navigate('#/registro')" class="px-3 py-1.5 rounded-xl bg-[#ff5a36] text-xs font-bold">Crear Stand</button>`);
    }

    window.navigate = hash => { location.hash = hash; };
    window.toggleCart = show => {
      const drawer = $('#cartDrawer');
      if (show) { renderCartDrawerContent(); drawer.classList.remove('hidden'); }
      else drawer.classList.add('hidden');
    };

    function renderCartDrawerContent() {
      const cdc = $('#cartDrawerContent');
      if (!cart.length) {
        cdc.innerHTML = `<div class="text-center py-12"><div class="text-5xl mb-2">🛒</div><p class="font-bold">Tu carrito está vacío</p><button class="btn mt-4" onclick="toggleCart(false); navigate('#/')">Ver stands</button></div>`;
        return;
      }
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      cdc.innerHTML = `
        <div class="space-y-3 flex-1 overflow-y-auto">
          ${cart.map((item, idx) => `
            <div class="flex items-center justify-between gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
              <div class="min-w-0 flex-1">
                <b class="text-sm block truncate">${h(item.name)}</b>
                <span class="text-xs text-slate-500">🏪 ${h(item.standName)} · ${money(item.price)} c/u</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button class="bg-slate-200 w-7 h-7 rounded font-bold" onclick="chgCartQty(${idx}, -1)">−</button>
                <span class="text-sm font-bold w-5 text-center">${item.qty}</span>
                <button class="bg-slate-200 w-7 h-7 rounded font-bold" onclick="chgCartQty(${idx}, 1)">+</button>
              </div>
            </div>`).join('')}
        </div>
        <div class="pt-4 border-t border-slate-200 mt-auto">
          <div class="flex justify-between items-center mb-4"><span class="font-bold text-base">Total</span><span class="disp text-xl font-extrabold text-[#ff5a36]">${money(total)}</span></div>
          <button class="btn text-base mb-2" onclick="toggleCart(false); navigate('#/checkout')">Iniciar Pedido</button>
          <button class="btn2 w-full text-sm !bg-slate-200 !text-[#10263a]" onclick="cart=[]; saveCart(); toggleCart(false); toast('Carrito vaciado');">Vaciar</button>
        </div>`;
    }

    window.chgCartQty = (idx, d) => {
      cart[idx].qty += d;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart();
      renderCartDrawerContent();
    };

    window.addToCart = (productId, standId, standName, name, price) => {
      const existing = cart.find(i => i.id === productId);
      if (existing) existing.qty++;
      else cart.push({ id: productId, standId, standName, name, price, qty: 1 });
      saveCart();
      toast('¡Agregado al carrito 🛒!');
      toggleCart(true);
    };

    window.openZoom = (productId, imgUrl, name, desc, price, standId, standName, isAgotado, specs) => {
      const optImg = optimizeCloudinaryUrl(imgUrl);
      let specsHtml = '';
      if (specs?.sizes) specsHtml += `<p class="text-xs text-slate-600 mt-1"><b>Talles:</b> ${specs.sizes.join(', ')}</p>`;
      if (specs?.calzados) specsHtml += `<p class="text-xs text-slate-600 mt-1"><b>Calce (Zapatillas):</b> ${specs.calzados.join(', ')}</p>`;
      if (specs?.liquidosMl) specsHtml += `<p class="text-xs text-slate-600 mt-1"><b>Volumen:</b> ${specs.liquidosMl}</p>`;
      if (specs?.gastronomy?.presentacion) specsHtml += `<p class="text-xs text-slate-600 mt-1"><b>Presentación:</b> ${specs.gastronomy.presentacion}</p>`;
      if (specs?.measures) specsHtml += `<p class="text-xs text-slate-600 mt-1"><b>Medidas:</b> ${specs.measures}</p>`;

      const standObj = DB.getStands().find(s => s.id === standId);
      const standIdentifier = standObj?.slug || standId;
      const shareUrl = `${window.location.origin}/#/stand/${standIdentifier}`;
      const shareText = encodeURIComponent(`¡Mirá este producto en Feria Virtual! 🎪
*${name}* (${money(price)})
Stand: ${standName}
👉 ${shareUrl}`);

      $('#zoomContent').innerHTML = `
        <div class="zoom-container mb-3 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden h-48" onclick="this.classList.toggle('zoomed')">
          ${optImg ? `<img src="${h(optImg)}" loading="lazy" class="w-full h-full object-contain">` : '<span class="text-5xl">📦</span>'}
        </div>
        <h3 class="disp text-lg font-bold">${h(name)}</h3>
        <p class="text-xs text-slate-600 mt-1">${h(desc || 'Sin descripción.')}</p>
        ${specsHtml}
        <div class="mt-4 pt-3 border-t border-slate-200 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="disp text-2xl font-extrabold text-[#ff5a36]">${money(price)}</span>
            <button class="btn text-xs !py-2.5 !w-auto px-5 ${isAgotado ? 'opacity-50 cursor-not-allowed' : ''}" ${isAgotado ? 'disabled' : ''} onclick="closeZoom(); addToCart(${productId}, ${standId}, '${h(standName)}', '${h(name)}', ${price})">${isAgotado ? 'Agotado' : 'Agregar al Carrito 🛒'}</button>
          </div>
          <a href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" class="btnwa text-xs !py-2 !w-full block text-center">💬 Compartir producto por WhatsApp</a>
        </div>`;
      $('#zoomModal').classList.remove('hidden');
    };
    window.closeZoom = () => $('#zoomModal').classList.add('hidden');

    window.adminLoginAsStand = id => {
      const s = DB.getStands().find(x => x.id === id);
      if (!s) return toast('Stand no encontrado');
      currentVendor = s;
      localStorage.setItem('fv_session', JSON.stringify(s));
      localStorage.setItem('fv_admin_impersonate', 'true');
      toast('Ingresando como ' + s.name);
      navigate('#/panel');
    };

    window.exitAdminAsStand = () => {
      localStorage.removeItem('fv_admin_impersonate');
      currentVendor = null;
      localStorage.removeItem('fv_session');
      navigate('#/admin');
    };

    async function homeView() {
      let stands = DB.getStands().filter(s => s.active).sort(() => Math.random() - 0.5);
      return `
        <section class="rounded-3xl bg-gradient-to-r from-amber-500 to-[#ff5a36] text-white p-5 mb-6 shadow-xl text-center">
          <div class="text-3xl mb-1">🚀 ¡LANZAMIENTO OFICIAL! 🚀</div>
          <h2 class="disp text-xl sm:text-2xl font-extrabold">¡Crear tu Stand en la Feria es 100% GRATIS!</h2>
          <button class="mt-3 bg-white text-[#10263a] font-bold px-5 py-2 rounded-xl text-sm shadow" onclick="navigate('#/registro')">Crear Stand Gratis</button>
        </section>
        <section class="rounded-3xl bg-[#10263a] text-white p-6 mb-6 shadow-xl">
          <h1 class="text-3xl font-extrabold">Feria Virtual 🎪</h1>
          <p class="mt-2 text-sm text-slate-300">Apoyá a los emprendedores locales. Elegí un stand y coordiná tu compra por WhatsApp.</p>
          <input id="searchInput" class="inp max-w-sm mt-4 !bg-white/10 !text-white placeholder:text-slate-400 !border-white/20 text-sm" placeholder="🔍 Buscar stand..." oninput="filterStands(this.value)">
        </section>
        <h2 class="text-xl font-extrabold mb-4">Stands Activos (${stands.length})</h2>
        <div id="standsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${stands.map(s => {
            const standSlug = s.slug || slugify(s.name) || s.id;
            return `
            <a class="stand-card" href="#/stand/${standSlug}">

          let waMsg = '';
          if (!hasSales && cycleEnded) {
            waMsg = `¡Hola, ${s.name}! 🤝 Pasaron tus primeros 7 días en Feria Virtual y queríamos escribirte para darte fuerzas. ¡No bajes los brazos! Tu espacio se renueva automáticamente por 7 días más gratis. Seguí subiendo fotos de tus productos y sumate en nuestro Instagram para tener más visibilidad: https://www.instagram.com/feriavirtual.shop/ 🚀📲 ¡Estamos para crecer juntos!`;
          } else if (hasSales) {
            waMsg = `¡Hola, ${s.name}! 📊 ¡Buenas noticias! Tu ciclo de 7 días en Feria Virtual cerró con ventas registradas por ${money(standTotalSales)}. El resumen de tu liquidación está disponible en tu panel. Para realizar la transferencia de la comisión (5%, equivalente a ${money(commission)}), podés hacerlo a través de Personal Pay a nombre de Walter Emanuel Canteros. (Recordá enviarnos el comprobante por acá). ¡Felicitaciones! Seguí subiendo más productos y etiquetanos en nuestro Instagram: https://www.instagram.com/feriavirtual.shop/ 🛍️✨`;
          } else {
            waMsg = `¡Hola, ${s.name}! 🌟 ¡Hola de nuevo! Te escribimos de Feria Virtual para recordarte que tu stand sigue activo. Tenés ${daysLeft} días restantes en tu ciclo actual. ¡Seguí subiendo fotos de tus productos y visitanos en https://www.instagram.com/feriavirtual.shop/ para potenciar tus ventas! 🚀`;
          }

          return { name: s.name, phone: s.phone, sales: standTotalSales, commission, hasSales, daysLeft, cycleEnded, waMsg };
        });

        content = `
          <div class="card text-left space-y-4">
            <h3 class="disp text-lg font-bold">💰 Cobros y Comisión por Feriante (5%)</h3>
            <div class="space-y-3">
              ${standLiquidations.map(sl => `
                <div class="bg-slate-50 p-4 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                  <div>
                    <b class="text-base block">${h(sl.name)}</b>
                    <span class="text-xs text-slate-500">Ventas totales: ${money(sl.sales)}</span>
                    <span class="block text-[11px] font-bold ${sl.cycleEnded && !sl.hasSales ? 'text-red-600' : 'text-amber-600'}">
                      ⏳ Ciclo 7 días: ${sl.cycleEnded ? '¡Ciclo cumplido! (Listo para mensaje de aliento)' : `${sl.daysLeft} días restantes`}
                    </span>
                    <span class="block text-[11px] ${sl.hasSales ? 'text-green-600 font-bold' : 'text-slate-500'}">
                      ${sl.hasSales ? '🟢 Registró ventas en el ciclo' : '⚪ Sin ventas registradas'}
                    </span>
                  </div>
                  <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="text-right">
                      <span class="text-[10px] uppercase font-bold text-slate-400 block">Comisión (5%)</span>
                      <span class="disp text-lg font-extrabold text-[#ff5a36]">${money(sl.commission)}</span>
                    </div>
                    ${sl.phone ? `<a href="https://wa.me/${sl.phone}?text=${encodeURIComponent(sl.waMsg)}" target="_blank" class="btnwa text-xs !py-2 !px-3 shrink-0">💬 Enviar WhatsApp</a>` : ''}
                  </div>
                </div>`).join('')}
            </div>
          </div>`;
      }

      return `
        <div class="flex justify-between items-center mb-4"><h1 class="disp text-2xl font-extrabold">🔒 Panel Superadmin</h1><button class="btn2 text-xs py-1 px-3" onclick="adminLogged=false;localStorage.removeItem('fv_admin_logged');route();">Cerrar</button></div>
        <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
          <button class="${adminTab==='stands'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="adminTab='stands'; route();">🏪 Stands & Contraseñas</button>
          <button class="${adminTab==='orders'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="adminTab='orders'; route();">🧾 Registro de Ventas</button>
          <button class="${adminTab==='liquidation'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="adminTab='liquidation'; route();">💰 Cobro Individual (5%)</button>
        </div>
        ${content}`;
    }

    window.handleAdminLogin = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (f.user === 'walchu86' && f.pass === 'pancha2026') { adminLogged = true; localStorage.setItem('fv_admin_logged', 'true'); route(); }
      else toast('Datos incorrectos');
    };

    window.toggleStandActive = async id => {
      const s = DB.getStands().find(x => x.id === id);
      if (s) { 
        s.active = !s.active; 
        if (s.active && !s.approvedAt) s.approvedAt = Date.now();
        await DB.saveStand(s); 
        toast('Estado actualizado'); 
        route(); 
      }
    };

    window.resetStandCycle = async id => {
      if (!confirm('¿Reiniciar ciclo de 7 días?')) return;
      const s = DB.getStands().find(x => x.id === id);
      if (s) { s.approvedAt = Date.now(); await DB.saveStand(s); toast('Ciclo reiniciado 🔄'); route(); }
    };

    window.adminDeleteStand = async (id, name) => {
      if (!confirm(`¿Estás seguro de borrar completamente el stand "${name}"? Esta acción eliminará el stand de la base de datos.`)) return;
      await DB.removeStand(id);
      toast('Stand eliminado correctamente');
      route();
    };

    let editingProdId = null;

    async function panelView() {
      if (!currentVendor) return navigate('#/ingresar');
      const stand = DB.getStands().find(s => s.id === currentVendor.id) || currentVendor;
      const products = DB.getProducts().filter(p => String(p.stand_id) === String(stand.id));
      if (!stand.active) return `<div class="card text-center py-10"><h1 class="text-2xl font-bold">Stand Pendiente de Verificación por Correo</h1><p class="text-sm text-slate-600 mt-2">Revisá tu casilla de correo para dar el OK a tu cuenta.</p><button class="btn max-w-xs mx-auto mt-4" onclick="logout()">Salir</button></div>`;

      const editingP = products.find(p => p.id === editingProdId) || {};
      const standardCats = ['Comida', 'Ropa', 'Calzado', 'Perfumeria', 'Manualidades'];
      const isCustomCat = editingP.category && !standardCats.includes(editingP.category);
      const selectedCatVal = isCustomCat ? 'Otro' : (editingP.category || '');

      return `
        <div class="flex justify-between items-center mb-6">
          <h1 class="disp text-2xl font-extrabold">⛺ ${h(stand.name)}</h1>
        </div>

        <!-- SECCIÓN DE CONFIGURACIÓN DEL STAND (MODIFICAR DESCRIPCIÓN Y DATOS) -->
        <div class="card mb-6 text-left border-2 border-amber-200 bg-amber-50/40">
          <h3 class="disp text-lg font-bold mb-3">⚙️ Configuración y Descripción de tu Stand</h3>
          <form onsubmit="updateStandProfile(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1">Nombre del Emprendimiento</label>
              <input class="inp text-sm bg-white" name="standName" value="${h(stand.name || '')}" required>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Descripción del Stand (¡Contanos qué vendés y tus redes o zona!)</label>
              <textarea class="inp text-sm bg-white" name="standDesc" rows="3" placeholder="Ej: Especialistas en repostería artesanal y budines caseros. Envíos en Corrientes Capital...">${h(stand.description || '')}</textarea>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">WhatsApp de contacto</label>
              <input class="inp text-sm bg-white" name="standPhone" type="tel" value="${h(stand.phone || '')}" required>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Actualizar Logo del Stand (opcional)</label>
              <input type="file" id="standLogoFile" accept="image/*" class="inp text-xs bg-white">
            </div>
            <button class="btn2 text-sm !bg-[#10263a] py-2.5" id="saveStandBtn">Guardar Cambios del Stand</button>
          </form>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <form class="card space-y-3 md:col-span-1 h-fit text-left" onsubmit="saveVendorProduct(event)">
            <h3 class="disp text-lg font-bold">${editingP.id ? '✏️ Editar Producto' : '➕ Nuevo Producto'}</h3>
            <input class="inp text-sm" name="name" placeholder="Nombre" value="${h(editingP.name || '')}" required>
            
            <select class="inp text-sm" name="categorySelect" required onchange="handleProdCategoryChange(this.value)">
              <option value="">Categoría...</option>
              <option value="Comida" ${selectedCatVal==='Comida'?'selected':''}>Comida</option>
              <option value="Ropa" ${selectedCatVal==='Ropa'?'selected':''}>Ropa</option>
              <option value="Calzado" ${selectedCatVal==='Calzado'?'selected':''}>Calzado</option>
              <option value="Perfumeria" ${selectedCatVal==='Perfumeria'?'selected':''}>Perfumería (Líquidos en ML)</option>
              <option value="Manualidades" ${selectedCatVal==='Manualidades'?'selected':''}>Manualidades</option>
              <option value="Otro" ${selectedCatVal==='Otro'?'selected':''}>Otro (Escribir categoría...)</option>
            </select>
            
            <div id="customProdCatContainer" class="${isCustomCat ? '' : 'hidden'}">
              <input class="inp text-sm" name="customCategory" id="customProdCatInput" placeholder="Escribí tu categoría" value="${h(isCustomCat ? editingP.category : '')}">
            </div>

            <div id="dynamicSpecsContainer"></div>

            <input class="inp text-sm" name="price" type="text" placeholder="Precio ($)" value="${editingP.price || ''}" required oninput="previewPrice(this.value)">
            <p id="pricePreview" class="text-xs text-slate-500 font-bold"></p>
            <input class="inp text-sm" name="discount" type="number" placeholder="% Descuento" value="${editingP.discount || ''}" min="0" max="95">
            <label class="block text-xs font-bold flex items-center gap-2"><input type="checkbox" name="agotado" ${editingP.agotado?'checked':''}> Marcar como Agotado</label>
            <textarea class="inp text-sm" name="description" rows="2" placeholder="Descripción...">${h(editingP.description || '')}</textarea>
            <label class="block text-xs font-bold">Foto: <input type="file" id="prodImage" accept="image/*" class="inp mt-1 text-xs bg-white"></label>
            <button class="btn text-sm py-2.5" id="saveProdBtn">${editingP.id ? 'Guardar Cambios' : 'Publicar Producto'}</button>
            ${editingP.id ? `<button type="button" class="btn2 w-full !bg-slate-300 !text-black text-sm mt-1" onclick="editingProdId=null;route();">Cancelar</button>` : ''}
          </form>

          <div class="md:col-span-2 space-y-4">
            <h3 class="disp text-xl font-bold">Tus Productos (${products.length})</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${products.map(p => `
                <div class="card !p-3 flex gap-3 items-center">
                  <div class="w-16 h-16 bg-slate-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center">
                    ${p.image ? `<img src="${h(optimizeCloudinaryUrl(p.image))}" loading="lazy" class="w-full h-full object-cover">` : '📦'}
                  </div>
                  <div class="flex-1 min-w-0">
                    <b class="text-sm truncate block">${h(p.name)} ${p.agotado?'<span class="text-red-500 text-[10px]">(Agotado)</span>':''}</b>
                    <span class="disp text-[#ff5a36] font-bold text-sm">${money(finalPrice(p))}</span>
                    <div class="flex gap-3 text-xs mt-1">
                      <button class="underline text-blue-600" onclick="editProduct(${p.id})">Editar</button>
                      <button class="underline text-red-600" onclick="deleteProduct(${p.id})">Borrar</button>
                    </div>
                  </div>
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    // FUNCIÓN PARA ACTUALIZAR LOS DATOS Y DESCRIPCIÓN DEL STAND DEL FERIANTE
    window.updateStandProfile = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const btn = $('#saveStandBtn');
      btn.disabled = true; btn.textContent = 'Actualizando stand...';

      try {
        const stand = DB.getStands().find(s => s.id === currentVendor.id);
        if (!stand) throw new Error('Stand no encontrado');

        const logoInput = $('#standLogoFile');
        let logoUrl = stand.logo || '';
        if (logoInput && logoInput.files[0]) {
          logoUrl = await uploadToCloudinary(logoInput.files[0]);
        }

        stand.name = f.standName;
        stand.slug = slugify(f.standName);
        stand.description = f.standDesc;
        stand.phone = cleanPhoneNumber(f.standPhone);
        stand.logo = logoUrl;

        await DB.saveStand(stand);
        currentVendor = stand;
        localStorage.setItem('fv_session', JSON.stringify(stand));

        toast('¡Descripción y datos del stand actualizados con éxito! ✨');
        route();
      } catch(err) {
        console.error(err);
        toast('Error al actualizar el stand');
        btn.disabled = false; btn.textContent = 'Guardar Cambios del Stand';
      }
    };

    window.previewPrice = val => {
      const p = parsePrice(val);
      const prev = $('#pricePreview');
      if (prev) prev.textContent = p > 0 ? `Se publicará a: ${money(p)}` : '';
    };

    window.handleProdCategoryChange = val => {
      const container = $('#customProdCatContainer');
      const input = $('#customProdCatInput');
      if (container && input) {
        if (val === 'Otro') { container.classList.remove('hidden'); input.required = true; }
        else { container.classList.add('hidden'); input.required = false; input.value = ''; }
      }
      renderDynamicSpecs(val, {});
    };

    window.renderDynamicSpecs = (category, specs = {}) => {
      const c = $('#dynamicSpecsContainer');
      if (!c) return;
      if (category === 'Comida') {
        c.innerHTML = `<input class="inp text-xs" name="presentacion" placeholder="Presentación (ej: x 6, porción)" value="${h(specs.gastronomy?.presentacion || '')}">`;
      } else if (category === 'Ropa') {
        c.innerHTML = `<input class="inp text-xs" name="sizes" placeholder="Talles de ropa (ej: S, M, L, XL)" value="${h(specs.sizes ? specs.sizes.join(', ') : '')}">`;
      } else if (category === 'Calzado') {
        c.innerHTML = `<input class="inp text-xs" name="calzados" placeholder="Calces de zapatilla (ej: 36, 37, 38, 39)" value="${h(specs.calzados ? specs.calzados.join(', ') : '')}">`;
      } else if (category === 'Perfumeria') {
        c.innerHTML = `<input class="inp text-xs" name="liquidosMl" placeholder="Volumen / Líquido en ML (ej: 50 ml, 100 ml)" value="${h(specs.liquidosMl || '')}">`;
      } else {
        c.innerHTML = `<input class="inp text-xs" name="measures" placeholder="Medidas / Especificación (ej: 10x20 cm)" value="${h(specs.measures || '')}">`;
      }
    };

    window.editProduct = id => {
      editingProdId = id;
      route();
      setTimeout(() => {
        const p = DB.getProducts().find(x => x.id === id);
        if (p) {
          const standardCats = ['Comida', 'Ropa', 'Calzado', 'Perfumeria', 'Manualidades'];
          const isCustom = !standardCats.includes(p.category);
          const sel = $('select[name="categorySelect"]');
          if (sel) {
            sel.value = isCustom ? 'Otro' : p.category;
            handleProdCategoryChange(sel.value);
            if (isCustom) {
              const customInput = $('#customProdCatInput');
              if (customInput) customInput.value = p.category;
            }
          }
          renderDynamicSpecs(p.category, p.specs || {});
          previewPrice(String(p.price));
        }
      }, 50);
    };

    window.saveVendorProduct = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const btn = $('#saveProdBtn');
      btn.disabled = true; btn.textContent = 'Guardando...';

      try {
        const fileInput = $('#prodImage');
        let imgUrl = editingProdId ? (DB.getProducts().find(p => p.id === editingProdId)?.image || '') : '';
        if (fileInput && fileInput.files[0]) {
          imgUrl = await uploadToCloudinary(fileInput.files[0]);
        }

        const finalCategory = f.categorySelect === 'Otro' ? (f.customCategory || 'General') : f.categorySelect;
        const specs = {};
        if (f.presentacion) specs.gastronomy = { presentacion: f.presentacion };
        if (f.sizes) specs.sizes = f.sizes.split(',').map(s => s.trim());
        if (f.calzados) specs.calzados = f.calzados.split(',').map(s => s.trim());
        if (f.liquidosMl) specs.liquidosMl = f.liquidosMl;
        if (f.measures) specs.measures = f.measures;

        const prod = {
          id: editingProdId || Date.now(),
          stand_id: currentVendor.id,
          name: f.name,
          category: finalCategory,
          price: parsePrice(f.price),
          discount: Number(f.discount || 0),
          agotado: f.agotado === 'on',
          description: f.description,
          image: imgUrl,
          specs,
          active: true
        };

        await DB.saveProduct(prod);
        editingProdId = null;
        toast('¡Guardado con éxito!');
        route();
      } catch(err) {
        toast('Error al guardar o subir foto. Intentá de nuevo.');
        btn.disabled = false; btn.textContent = editingProdId ? 'Guardar Cambios' : 'Publicar Producto';
      }
    };

    window.deleteProduct = async id => {
      if (!confirm('¿Borrar producto?')) return;
      await DB.removeProduct(id);
      toast('Producto eliminado');
      route();
    };

    // Vista de verificación por correo con manejo elegante para doble clic o reloads
    async function verificarView(token) {
      if (!token) return `<div class="card text-center py-10"><h2 class="text-xl font-bold">Token inválido</h2><button class="btn mt-4 max-w-xs mx-auto" onclick="navigate('#/')">Volver al inicio</button></div>`;
      
      const stands = DB.getStands();
      const stand = stands.find(s => s.token === token);

      if (!stand) {
        return `
          <div class="card max-w-lg mx-auto text-center py-10 space-y-4 shadow-xl">
            <div class="text-6xl">✨</div>
            <h1 class="disp text-2xl font-extrabold">¡Tu cuenta ya está activa!</h1>
            <p class="text-sm text-slate-600">Este enlace ya fue procesado con éxito anteriormente o tu stand ya se encuentra online.</p>
            <button class="btn max-w-xs mx-auto" onclick="navigate('#/ingresar')">Iniciar Sesión</button>
          </div>`;
      }

      // Activar el stand automáticamente en Firebase y refrescar base de datos local
      stand.active = true;
      delete stand.token; // Limpiar token para seguridad
      await DB.saveStand(stand);
      if (typeof DB.refresh === 'function') await DB.refresh();

      return `
        <div class="card max-w-lg mx-auto text-center py-10 space-y-4 shadow-xl">
          <div class="text-6xl">🎉</div>
          <h1 class="disp text-2xl font-extrabold">¡Stand verificado y activado con éxito!</h1>
          <p class="text-sm text-slate-600">¡Felicitaciones <b>${h(stand.name)}</b>! Tu correo ha sido confirmado correctamente y tu espacio ya está online en la feria.</p>
          <button class="btn max-w-xs mx-auto" onclick="navigate('#/ingresar')">Iniciar Sesión en mi Stand</button>
        </div>`;
    }

    window.route = async () => {
      const hash = location.hash || '#/';
      const cleanHash = hash.replace(/^#\/?/, '');
      const [path, routeArg] = cleanHash.split('/');
      renderNav();
      try {
        if (!path) app.innerHTML = await homeView();
        else if (path === 'stand') app.innerHTML = await standView(routeArg);
        else if (path === 'checkout') app.innerHTML = checkoutView();
        else if (path === 'ingresar' || path === 'registro') app.innerHTML = authView(path === 'registro');
        else if (path === 'panel') app.innerHTML = await panelView();
        else if (path === 'admin') app.innerHTML = adminDashboardView();
        else if (path === 'verificar' || cleanHash.startsWith('verificar')) {
          const queryString = hash.includes('?') ? hash.split('?')[1] : '';
          const urlParams = new URLSearchParams(queryString);
          const token = urlParams.get('token');
          app.innerHTML = await verificarView(token);
        }
        else app.innerHTML = await homeView();
      } catch(err) {
        app.innerHTML = `<div class="card text-center py-10">Ocurrió un error.</div>`;
      }
      window.scrollTo(0, 0);
    };

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', () => { if (!location.hash) location.replace('#/'); route(); });
  </script>
</body>
</html>
