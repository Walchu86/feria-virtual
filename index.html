<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feria Virtual · feriavirtual.shop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎪%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #e4f0f1; color: #10263a; overflow-x: hidden; }
    h1, h2, h3, .disp { font-family: 'Bricolage Grotesque', sans-serif; }
    .inp { width: 100%; border: 2px solid #c5d8dc; border-radius: 12px; padding: 10px 14px; background: #fff; font-size: 16px; }
    .inp:focus { outline: 3px solid #ff5a36; border-color: #ff5a36; }
    .btn { background: #ff5a36; color: #fff; font-weight: 700; border-radius: 12px; padding: 12px 18px; display: inline-block; text-align: center; cursor: pointer; border: none; transition: background .2s; width: 100%; }
    .btn:hover { background: #e84823; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn2 { background: #10263a; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 14px; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .btnwa { background: #1faa59; color: #fff; font-weight: 700; border-radius: 12px; padding: 12px 18px; display: inline-block; text-align: center; cursor: pointer; text-decoration: none; width: 100%; }
    .card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 4px 12px rgba(16,38,58,.06); width: 100%; box-sizing: border-box; }
    
    .stand-card { background: #fff; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 2px solid #e4f0f1; transition: all .2s; text-decoration: none; color: #10263a; }
    .stand-card:hover { border-color: #ff5a36; transform: translateY(-2px); }

    .zoom-container { overflow: hidden; position: relative; cursor: zoom-in; }
    .zoom-container img { transition: transform 0.3s ease; }
    .zoom-container.zoomed img { transform: scale(2); cursor: zoom-out; }
  </style>

  <!-- FIREBASE FIRESTORE INTEGRATION ROBUSTA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQgmq6xVihzWN-f0LbzlzZrSecYeEnjs",
      authDomain: "feria-virtual-shop.firebaseapp.com",
      projectId: "feria-virtual-shop",
      storageBucket: "feria-virtual-shop.firebasestorage.app",
      messagingSenderId: "566189255248",
      appId: "1:566189255248:web:5a44efcol1e4cb8ad3c355"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let memoryStands = [];
    let memoryProducts = [];
    let memoryOrders = [];
    let memoryReviews = [];

    async function fetchCloudData() {
      try {
        const standsSnap = await getDocs(collection(db, 'stands'));
        memoryStands = standsSnap.docs.map(d => d.data());

        const prodsSnap = await getDocs(collection(db, 'products'));
        memoryProducts = prodsSnap.docs.map(d => d.data());

        const ordersSnap = await getDocs(collection(db, 'orders'));
        memoryOrders = ordersSnap.docs.map(d => d.data());

        const reviewsSnap = await getDocs(collection(db, 'reviews'));
        memoryReviews = reviewsSnap.docs.map(d => d.data());

        if (!memoryStands.length) {
          memoryStands = [
            { id: 1, name: 'Panadería Doña Rosa', rubro: 'Comida', description: 'Alfajores artesanales, rosquitas y pan casero recién horneado.', color: '#ff5a36', phone: '5493794000001', email: 'rosa@feria.shop', active: true, logo: '', created: Date.now() },
            { id: 2, name: 'Estilo Urbano', rubro: 'Ropa', description: 'Indumentaria urbana y remeras con diseños exclusivos.', color: '#3b82f6', phone: '5493794000002', email: 'urbano@feria.shop', active: true, logo: '', created: Date.now() }
          ];
          memoryProducts = [
            { id: 101, stand_id: 1, name: 'Alfajores de Maicena x6', category: 'Comida', price: 4500, discount: 0, image: '', description: 'Rellenos con dulce de leche casero.', active: true, specs: {} },
            { id: 102, stand_id: 2, name: 'Remera Oversize Algodón', category: 'Ropa', price: 12000, discount: 10, image: '', description: 'Excelente calidad.', active: true, specs: { sizes: ['S', 'M', 'L', 'XL'] } }
          ];
          for (let s of memoryStands) await setDoc(doc(db, 'stands', String(s.id)), s);
          for (let p of memoryProducts) await setDoc(doc(db, 'products', String(p.id)), p);
        }
      } catch (err) {
        console.error("Error al sincronizar con Firestore:", err);
      }
      if (typeof window.route === 'function') window.route();
    }

    fetchCloudData();

    window.CloudDB = {
      getStands: () => memoryStands,
      saveStands: async (arr) => {
        memoryStands = arr;
        for (let s of arr) {
          await setDoc(doc(db, 'stands', String(s.id)), s);
        }
      },
      removeStand: async (id) => {
        memoryStands = memoryStands.filter(s => s.id !== id);
        try { await deleteDoc(doc(db, 'stands', String(id))); } catch(e){}
      },
      getProducts: () => memoryProducts,
      saveProducts: async (arr) => {
        memoryProducts = arr;
        for (let p of arr) {
          await setDoc(doc(db, 'products', String(p.id)), p);
        }
      },
      removeProduct: async (id) => {
        memoryProducts = memoryProducts.filter(p => p.id !== id);
        try { await deleteDoc(doc(db, 'products', String(id))); } catch(e){}
      },
      getOrders: () => memoryOrders,
      saveOrders: async (arr) => {
        memoryOrders = arr;
        for (let o of arr) {
          await setDoc(doc(db, 'orders', String(o.id)), o);
        }
      },
      getReviews: () => memoryReviews,
      saveReviews: async (arr) => {
        memoryReviews = arr;
        for (let i = 0; i < arr.length; i++) {
          let r = arr[i];
          if (!r.id) r.id = Date.now() + i;
          await setDoc(doc(db, 'reviews', String(r.id)), r);
        }
      },
      refresh: fetchCloudData
    };
  </script>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-[#10263a] text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-2 sm:px-4 h-16 flex items-center justify-between gap-1">
      <a href="#/" class="flex items-center gap-1.5 min-w-0 shrink">
        <span class="text-xl sm:text-2xl shrink-0">🎪</span>
        <span class="disp font-extrabold text-xs sm:text-xl truncate tracking-tight">Feria Virtual</span>
      </a>
      <nav id="nav" class="flex items-center gap-1 text-[11px] sm:text-sm font-bold shrink-0"></nav>
    </div>
  </header>

  <main id="app" class="max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-1"><p class="card text-center py-8">☁️ Sincronizando con la nube...</p></main>

  <!-- Carrito Deslizante Lateral -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/50 hidden transition-opacity" onclick="toggleCart(false)">
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white p-4 sm:p-6 shadow-2xl flex flex-col overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-4 border-b border-[#e4f0f1]">
        <h2 class="disp text-xl sm:text-2xl font-extrabold">🛒 Tu Carrito</h2>
        <button type="button" class="btn2 !px-3 !py-1 text-sm" onclick="toggleCart(false)">✕</button>
      </div>
      <div id="cartDrawerContent" class="flex-1 py-4 space-y-4"></div>
    </div>
  </div>

  <!-- Modal Zoom -->
  <div id="zoomModal" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-3" onclick="closeZoom()">
    <div class="bg-white rounded-3xl p-4 max-w-lg w-full relative overflow-hidden" onclick="event.stopPropagation()">
      <button type="button" class="absolute top-3 right-3 bg-slate-200 rounded-full w-8 h-8 font-bold flex items-center justify-center" onclick="closeZoom()">✕</button>
      <div id="zoomContent" class="text-center"></div>
    </div>
  </div>

  <footer class="bg-[#10263a] text-white py-6 text-center text-xs sm:text-sm mt-12 px-4">
    <p>🎪 <b>Feria Virtual</b> · feriavirtual.shop © 2026</p>
    <p class="text-slate-400 mt-1">Conectando emprendedores y compradores locales.</p>
    <a href="https://wa.me/5493794655867?text=Hola%20Walchu,%20necesito%20soporte%20con%20la%20Feria%20Virtual" target="_blank" class="inline-block mt-3 bg-white/10 px-3 py-1.5 rounded-full hover:bg-white/20">💬 Soporte Técnico con Walchu</a>
    <div class="mt-2"><a href="#/admin" class="text-[11px] text-slate-400 underline">🔒 Acceso Superadministrador</a></div>
  </footer>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#10263a] text-white px-4 py-2 rounded-xl hidden z-50 max-w-[90vw] text-center shadow-lg text-sm"></div>

  <script>
    const ADMIN_WHATSAPP = '5493794655867';
    const PAYMENT_INFO = {
      alias: 'feria.virtual',
      cvu: '0000076500000039584142',
      holder: 'Walter Emanuel Canteros',
      fee: '$10.000 ARS'
    };
    
    const CLOUD_NAME = 'xr6zpe1k';
    const UPLOAD_PRESET = 'feria_preset';

    const uploadToCloudinary = async (file) => {
      if (!file) return '';
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        return data.secure_url || '';
      } catch (err) {
        console.error('Error al subir imagen a Cloudinary:', err);
        return '';
      }
    };

    const DB = {
      getStands: () => window.CloudDB ? window.CloudDB.getStands() : [],
      saveStands: async d => { if(window.CloudDB) await window.CloudDB.saveStands(d); },
      removeStand: async id => { if(window.CloudDB) await window.CloudDB.removeStand(id); },
      getProducts: () => window.CloudDB ? window.CloudDB.getProducts() : [],
      saveProducts: async d => { if(window.CloudDB) await window.CloudDB.saveProducts(d); },
      removeProduct: async id => { if(window.CloudDB) await window.CloudDB.removeProduct(id); },
      getOrders: () => window.CloudDB ? window.CloudDB.getOrders() : [],
      saveOrders: async d => { if(window.CloudDB) await window.CloudDB.saveOrders(d); },
      getReviews: () => window.CloudDB ? window.CloudDB.getReviews() : [],
      saveReviews: async d => { if(window.CloudDB) await window.CloudDB.saveReviews(d); },
      refresh: () => { if(window.CloudDB) window.CloudDB.refresh(); }
    };

    const $ = s => document.querySelector(s);
    const app = $('#app');
    const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });
    const finalPrice = p => Math.round(Number(p.price) * (1 - (Number(p.discount) || 0) / 100));
    const toast = m => {
      const t = $('#toast');
      t.textContent = m;
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
    };

    let cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
    let currentVendor = JSON.parse(localStorage.getItem('fv_session') || 'null');

    const saveCart = () => {
      localStorage.setItem('fv_cart', JSON.stringify(cart));
      renderNav();
    };

    function renderNav() {
      const totalItems = cart.reduce((acc, i) => acc + i.qty, 0);
      const totalPrice = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      $('#nav').innerHTML = `
        <button type="button" onclick="toggleCart(true)" class="px-1.5 sm:px-2.5 py-1.5 rounded-xl bg-white/10 flex items-center gap-1 shrink-0 text-xs">
          🛒 (${totalItems}) <span class="hidden md:inline">${money(totalPrice)}</span>
        </button>` +
        (currentVendor 
          ? `<button type="button" onclick="navigate('#/panel')" class="px-2 sm:px-3 py-1.5 rounded-xl bg-[#ff5a36] text-xs shrink-0 font-bold">Mi Stand</button>
             <button type="button" onclick="logout()" class="px-1 py-1.5 opacity-80 hover:opacity-100 text-xs shrink-0">Salir</button>`
          : `<button type="button" onclick="navigate('#/ingresar')" class="px-1.5 sm:px-2 py-1.5 text-xs shrink-0">Vendedor</button>
             <button type="button" onclick="navigate('#/registro')" class="px-2 sm:px-3 py-1.5 rounded-xl bg-[#ff5a36] text-xs shrink-0 font-bold">Crear Stand</button>`);
    }

    window.navigate = hash => { location.hash = hash; };

    window.toggleCart = show => {
      const drawer = $('#cartDrawer');
      if (show) {
        renderCartDrawerContent();
        drawer.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
      }
    };

    function renderCartDrawerContent() {
      const cdc = $('#cartDrawerContent');
      if (!cart.length) {
        cdc.innerHTML = `<div class="text-center py-12"><div class="text-5xl mb-2">🛒</div><p class="font-bold">Tu carrito está vacío</p><button type="button" class="btn mt-4" onclick="toggleCart(false); navigate('#/')">Ver stands</button></div>`;
        return;
      }
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      cdc.innerHTML = `
        <div class="space-y-3 flex-1 overflow-y-auto">
          ${cart.map((item, idx) => `
            <div class="flex items-center justify-between gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
              <div class="min-w-0 flex-1">
                <b class="text-sm block truncate">${h(item.name)}</b>
                <span class="text-xs text-slate-500 truncate block">🏪 ${h(item.standName)} · ${money(item.price)} c/u</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button type="button" class="bg-slate-200 w-7 h-7 rounded font-bold flex items-center justify-center text-sm" onclick="chgCartQty(${idx}, -1)">−</button>
                <span class="text-sm font-bold w-5 text-center">${item.qty}</span>
                <button type="button" class="bg-slate-200 w-7 h-7 rounded font-bold flex items-center justify-center text-sm" onclick="chgCartQty(${idx}, 1)">+</button>
              </div>
            </div>`).join('')}
        </div>
        <div class="pt-4 border-t border-slate-200 mt-auto">
          <div class="flex justify-between items-center mb-4"><span class="font-bold text-base">Total acumulado</span><span class="disp text-xl sm:text-2xl font-extrabold text-[#ff5a36]">${money(total)}</span></div>
          <button type="button" class="btn text-base mb-2 !py-3" onclick="toggleCart(false); navigate('#/checkout')">Iniciar Pedido</button>
          <button type="button" class="btn2 w-full text-sm !bg-slate-200 !text-[#10263a]" onclick="cart=[]; saveCart(); toggleCart(false); toast('Carrito vaciado');">Vaciar carrito</button>
        </div>`;
    }

    window.chgCartQty = (idx, d) => {
      cart[idx].qty += d;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart();
      renderCartDrawerContent();
    };

    window.addToCart = (productId, standId, standName, name, price) => {
      const existing = cart.find(i => i.id === productId);
      if (existing) existing.qty++;
      else cart.push({ id: productId, standId, standName, name, price, qty: 1 });
      saveCart();
      toast('¡Agregado al carrito 🛒!');
      toggleCart(true);
    };

    window.openZoom = (imgUrl, name, desc) => {
      $('#zoomContent').innerHTML = `
        <div class="zoom-container mb-3 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden h-56 sm:h-64" onclick="this.classList.toggle('zoomed')">
          ${imgUrl ? `<img src="${h(imgUrl)}" class="w-full h-full object-contain">` : '<span class="text-6xl">📦</span>'}
        </div>
        <h3 class="disp text-lg sm:text-xl font-bold">${h(name)}</h3>
        <p class="text-sm text-slate-600 mt-1">${h(desc || 'Sin descripción adicional.')}</p>
        <p class="text-xs text-slate-400 mt-2">💡 Tocá la foto para hacer zoom.</p>`;
      $('#zoomModal').classList.remove('hidden');
    };
    window.closeZoom = () => $('#zoomModal').classList.add('hidden');

    async function homeView() {
      const stands = DB.getStands().filter(s => s.active);
      return `
        <section class="rounded-3xl bg-[#10263a] text-white p-5 sm:p-8 md:p-10 mb-6 shadow-xl relative overflow-hidden">
          <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold">Feria Virtual 🎪</h1>
          <p class="mt-2 text-sm sm:text-base max-w-xl text-slate-300">Apoyá a los emprendedores locales. Elegí un stand, mirá sus productos y coordiná tu compra directo por WhatsApp.</p>
          <div class="mt-5">
            <input id="searchInput" class="inp max-w-sm !bg-white/10 !text-white placeholder:text-slate-400 !border-white/20 text-sm" placeholder="🔍 ¿Qué estás buscando hoy?" oninput="filterStands(this.value)">
          </div>
        </section>
        
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl sm:text-2xl font-extrabold">Stands Activos (${stands.length})</h2>
        </div>

        <div id="standsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${stands.length ? stands.map(s => `
            <a class="stand-card" href="#/stand/${s.id}">
              <div class="w-14 h-14 rounded-2xl bg-slate-100 overflow-hidden shadow-inner flex items-center justify-center shrink-0 border" style="border-color:${h(s.color || '#ff5a36')}">
                ${s.logo ? `<img src="${h(s.logo)}" class="w-full h-full object-cover">` : '<span class="text-2xl">⛺</span>'}
              </div>
              <div class="flex-1 min-w-0">
                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full inline-block mb-0.5 text-white" style="background:${h(s.color || '#ff5a36')}">${h(s.rubro)}</span>
                <b class="disp text-base block truncate leading-snug">${h(s.name)}</b>
                <p class="text-xs text-slate-500 truncate">${h(s.description || 'Ver productos →')}</p>
              </div>
              <span class="text-slate-400 font-bold text-lg pr-1">›</span>
            </a>`).join('') : '<p class="card col-span-full text-center py-8 text-slate-500">No hay stands activos todavía. Aprobálos desde el panel de administración (#/admin).</p>'}
        </div>

        <div class="card mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 bg-[#f3f9fa] border-2 border-[#c5d8dc]">
          <div class="text-center sm:text-left">
            <h3 class="disp text-lg sm:text-xl font-bold">¿Tenés un emprendimiento?</h3>
            <p class="text-xs sm:text-sm text-slate-600">Abrí tu stand en la feria por <b>$10.000/mes</b> + 5% comisión semanal.</p>
          </div>
          <button type="button" class="btn sm:w-auto shrink-0" onclick="navigate('#/registro')">Crear mi stand</button>
        </div>`;
    }

    window.filterStands = query => {
      const q = query.toLowerCase();
      const grid = $('#standsGrid');
      if (!grid) return;
      const stands = DB.getStands().filter(s => s.active && (s.name.toLowerCase().includes(q) || s.rubro.toLowerCase().includes(q) || s.description.toLowerCase().includes(q)));
      grid.innerHTML = stands.length ? stands.map(s => `
        <a class="stand-card" href="#/stand/${s.id}">
          <div class="w-14 h-14 rounded-2xl bg-slate-100 overflow-hidden shadow-inner flex items-center justify-center shrink-0 border" style="border-color:${h(s.color || '#ff5a36')}">
            ${s.logo ? `<img src="${h(s.logo)}" class="w-full h-full object-cover">` : '<span class="text-2xl">⛺</span>'}
          </div>
          <div class="flex-1 min-w-0">
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full inline-block mb-0.5 text-white" style="background:${h(s.color || '#ff5a36')}">${h(s.rubro)}</span>
            <b class="disp text-base block truncate leading-snug">${h(s.name)}</b>
            <p class="text-xs text-slate-500 truncate">${h(s.description || 'Ver productos →')}</p>
          </div>
          <span class="text-slate-400 font-bold text-lg pr-1">›</span>
        </a>`).join('') : '<p class="card col-span-full text-center py-8 text-slate-500">No se encontraron stands con esa búsqueda.</p>';
    };

    async function standView(id) {
      const stand = DB.getStands().find(s => s.id === Number(id));
      if (!stand || !stand.active) return `<div class="card text-center"><h1 class="text-xl font-bold mb-2">Stand no encontrado</h1><button type="button" class="btn max-w-xs mx-auto" onclick="navigate('#/')">Volver al inicio</button></div>`;
      const products = DB.getProducts().filter(p => p.stand_id === stand.id && p.active);
      const reviews = DB.getReviews().filter(r => r.stand_id === stand.id);
      const avgRating = reviews.length ? (reviews.reduce((a,b)=>a+b.rating,0)/reviews.length).toFixed(1) : 'Nuevo';

      return `
        <div class="rounded-3xl p-5 sm:p-6 mb-6 text-white shadow-lg flex flex-col sm:flex-row items-center sm:items-start gap-4 text-center sm:text-left" style="background:${h(stand.color || '#ff5a36')}">
          ${stand.logo ? `<div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-white overflow-hidden shadow-md flex items-center justify-center shrink-0"><img src="${h(stand.logo)}" class="w-full h-full object-cover"></div>` : ''}
          <div class="flex-1 min-w-0 w-full">
            <button type="button" class="underline text-xs sm:text-sm mb-2 font-bold block mx-auto sm:mx-0" onclick="navigate('#/')">← Volver al inicio</button>
            <h1 class="text-2xl sm:text-3xl font-extrabold flex flex-col sm:flex-row items-center sm:items-center gap-2">${h(stand.name)} <span class="text-[11px] bg-white/20 px-2.5 py-0.5 rounded-full uppercase">${h(stand.rubro)}</span></h1>

                const data = standSales[s.id] || { totalSales: 0, itemsCount: 0, details: [] };
                const commission = data.totalSales * 0.05;
                const waText = `Hola ${s.name}! Te escribo de la administración de la Feria Virtual para realizar la liquidación de ventas semanales:\n\n` +
                  `📦 Productos vendidos: ${data.itemsCount}\n` +
                  (data.details.length ? `Detalle:\n` + data.details.join('\n') + `\n\n` : '') +
                  `💵 Total Vendido: ${money(data.totalSales)}\n` +
                  `🏷️ Tu comisión (5%) a depositar a ${PAYMENT_INFO.holder} (Alias: ${PAYMENT_INFO.alias}): *${money(commission)}*\n\n` +
                  `Por favor, enviame el comprobante de la transferencia cuando realices el depósito. ¡Muchas gracias!`;

                return `
                  <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div class="flex-1">
                      <b class="text-base disp text-[#10263a] block">🏪 ${h(s.name)}</b>
                      <span class="text-xs text-slate-500">Teléfono: ${s.phone || 'Sin tel'}</span>
                      <div class="mt-2 text-xs space-y-1">
                        <p>Total Vendido: <b class="text-[#10263a]">${money(data.totalSales)}</b></p>
                        <p>Comisión 5% a cobrar: <b class="text-[#ff5a36] text-sm">${money(commission)}</b></p>
                      </div>
                    </div>
                    <div>
                      ${s.phone ? `<a href="https://wa.me/${s.phone}?text=${encodeURIComponent(waText)}" target="_blank" class="btnwa text-xs !py-2 px-3 block text-center">💬 Enviar Liquidación por WhatsApp</a>` : '<span class="text-xs text-red-500">Sin teléfono</span>'}
                    </div>
                  </div>`;
              }).join('') : '<p class="text-center py-4">No hay stands para liquidar.</p>'}
            </div>
          </div>`;
      }

      return `
        <div class="flex justify-between items-center mb-4">
          <h1 class="disp text-2xl font-extrabold">🔒 Panel Superadmin</h1>
          <button class="btn2 text-xs py-1.5 px-3 !bg-slate-200 !text-[#10263a]" onclick="adminLogout()">Cerrar Admin</button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-6">
          <div class="card !p-3"><p class="text-[11px] text-slate-500">Stands Totales</p><p class="disp text-xl font-extrabold">${stands.length}</p></div>
          <div class="card !p-3"><p class="text-[11px] text-slate-500">Pendientes</p><p class="disp text-xl font-extrabold text-amber-600">${stands.filter(s=>!s.active).length}</p></div>
          <div class="card !p-3"><p class="text-[11px] text-slate-500">Productos</p><p class="disp text-xl font-extrabold">${products.length}</p></div>
          <div class="card !p-3"><p class="text-[11px] text-slate-500">Ventas Totales</p><p class="disp text-xl font-extrabold">${money(totalVentas)}</p></div>
          <div class="card !p-3 border-2 border-[#ff5a36] col-span-2 sm:col-span-1"><p class="text-[11px] text-slate-500">Tu Comisión (5%)</p><p class="disp text-xl font-extrabold text-[#ff5a36]">${money(totalComisiones)}</p></div>
        </div>
        <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
          <button class="${adminTab==='stands'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="adminTab='stands'; route();">🏪 Stands</button>
          <button class="${adminTab==='orders'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="adminTab='orders'; route();">🧾 Pedidos</button>
          <button class="${adminTab==='liquidation'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="adminTab='liquidation'; route();">💰 Liquidación Semanal</button>
        </div>
        ${content}`;
    }

    // --- PANEL DEL VENDEDOR ---
    let vendorTab = 'products';
    let editingProdId = null;

    async function panelView() {
      if (!currentVendor) return navigate('#/ingresar');
      const stands = DB.getStands();
      const stand = stands.find(s => s.id === currentVendor.id) || currentVendor;
      const products = DB.getProducts().filter(p => p.stand_id === stand.id);

      if (!stand.active) {
        return `
          <div class="card max-w-lg mx-auto text-center py-10 space-y-3">
            <div class="text-5xl">⏳</div>
            <h1 class="disp text-2xl font-bold">Stand Pendiente de Activación</h1>
            <p class="text-sm text-slate-600">Tu stand está pendiente de aprobación por el administrador.</p>
            <button class="btn max-w-xs mx-auto" onclick="logout()">Cerrar Sesión</button>
          </div>`;
      }

      let tabContent = '';
      if (vendorTab === 'products') {
        const editingP = products.find(p => p.id === editingProdId) || {};
        const standardCats = ['Comida', 'Ropa', 'Calzado', 'Manualidades'];
        const isCustomCat = editingP.category && !standardCats.includes(editingP.category);
        const selectedCatVal = isCustomCat ? 'Otro' : (editingP.category || '');

        tabContent = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <form class="card space-y-3 md:col-span-1 h-fit text-left" onsubmit="saveVendorProduct(event)" id="prodForm">
              <h3 class="disp text-lg sm:text-xl font-bold">${editingP.id ? '✏️ Editar Producto' : '➕ Nuevo Producto'}</h3>
              <input class="inp text-sm" name="name" placeholder="Nombre del producto" value="${h(editingP.name || '')}" required>
              
              <select class="inp text-sm" name="categorySelect" id="prodCategorySelect" required onchange="handleProdCategoryChange(this.value)">
                <option value="">Categoría...</option>
                <option value="Comida" ${selectedCatVal==='Comida'?'selected':''}>Comida</option>
                <option value="Ropa" ${selectedCatVal==='Ropa'?'selected':''}>Ropa / Indumentaria</option>
                <option value="Calzado" ${selectedCatVal==='Calzado'?'selected':''}>Calzado</option>
                <option value="Manualidades" ${selectedCatVal==='Manualidades'?'selected':''}>Manualidades / Decoración</option>
                <option value="Otro" ${selectedCatVal==='Otro'?'selected':''}>Otro (Escribir categoría...)</option>
              </select>

              <div id="customProdCatContainer" class="${isCustomCat ? '' : 'hidden'}">
                <input class="inp text-sm" name="customCategory" id="customProdCatInput" placeholder="Escribí tu categoría..." value="${h(isCustomCat ? editingP.category : '')}">
              </div>

              <div id="dynamicSpecsContainer"></div>
              <div class="grid grid-cols-2 gap-2">
                <input class="inp text-sm" name="price" type="number" placeholder="Precio ($)" value="${editingP.price || ''}" required>
                <input class="inp text-sm" name="discount" type="number" placeholder="% Desc. (opc)" value="${editingP.discount || ''}" min="0" max="95">
              </div>
              <textarea class="inp text-sm" name="description" rows="2" placeholder="Descripción...">${h(editingP.description || '')}</textarea>
              <label class="block text-xs font-bold">Foto del producto:
                <input type="file" id="prodImage" accept="image/*" class="inp mt-1 text-xs bg-white">
              </label>
              <button class="btn text-sm py-2.5" id="saveProdBtn">${editingP.id ? 'Guardar Cambios' : 'Publicar Producto'}</button>
              ${editingP.id ? `<button type="button" class="btn2 w-full !bg-slate-300 !text-black text-sm" onclick="editingProdId=null; route();">Cancelar</button>` : ''}
            </form>

            <div class="md:col-span-2 space-y-4">
              <div class="card flex flex-col sm:flex-row items-center justify-between gap-3 bg-[#f3f9fa]">
                <div>
                  <h3 class="disp font-bold text-sm sm:text-base">Herramienta Masiva</h3>
                  <p class="text-xs text-slate-600">Aumentar o bajar precios de todo tu catálogo por porcentaje.</p>
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                  <input id="massPct" type="number" placeholder="% (ej: 10)" class="inp !w-24 !py-1 text-sm">
                  <button type="button" class="btn2 !py-1 text-sm shrink-0" onclick="applyMassPrice()">Aplicar</button>
                </div>
              </div>

              <h3 class="disp text-xl font-bold">Tus Productos (${products.length})</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${products.length ? products.map(p => `
                  <div class="card !p-3 flex gap-3 items-center">
                    <div class="w-16 h-16 bg-slate-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center">
                      ${p.image ? `<img src="${h(p.image)}" class="w-full h-full object-cover">` : '📦'}
                    </div>
                    <div class="flex-1 min-w-0">
                      <b class="text-sm truncate block">${h(p.name)}</b>
                      <span class="text-[11px] text-slate-500 uppercase block">${h(p.category)}</span>
                      <span class="disp text-[#ff5a36] font-bold text-sm">${money(finalPrice(p))}</span>
                      <div class="flex gap-3 text-xs mt-1">
                        <button class="underline font-bold text-blue-600" onclick="editProduct(${p.id})">Editar ✏️</button>
                        <button class="underline text-red-600" onclick="deleteProduct(${p.id})">Borrar 🗑️</button>
                      </div>
                    </div>
                  </div>`).join('') : '<p class="card">No cargaste productos aún.</p>'}
              </div>
            </div>
          </div>`;
      } else if (vendorTab === 'orders') {
        const orders = DB.getOrders().filter(o => o.cart.some(i => i.standId === stand.id));
        tabContent = `
          <div class="card overflow-x-auto">
            <h3 class="disp text-xl font-bold mb-3">🧾 Pedidos Recibidos</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-sm min-w-[500px]">
                <tr><th>N°</th><th>Comprador</th><th>Productos</th><th>Total</th><th>Estado</th><th>Acción</th></tr>
                ${orders.length ? orders.map(o => `
                  <tr>
                    <td>#${o.id}</td>
                    <td><b>${h(o.buyer.name)}</b><br><a class="underline" href="https://wa.me/${o.buyer.phone}" target="_blank">${o.buyer.phone}</a></td>
                    <td>${o.cart.filter(i=>i.standId===stand.id).map(i=>`${i.qty}x ${i.name}`).join(', ')}</td>
                    <td><b>${money(o.cart.filter(i=>i.standId===stand.id).reduce((a,b)=>a+(b.price*b.qty),0))}</b></td>
                    <td><span class="px-2 py-0.5 rounded-full text-xs font-bold ${o.delivered?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800'}">${o.delivered?'Entregado':'Pendiente'}</span></td>
                    <td><button class="btn2 !py-1 !px-2 text-xs" onclick="toggleOrderStatus('${o.id}')">${o.delivered?'Marcar Pendiente':'Marcar Entregado'}</button></td>
                  </tr>`).join('') : '<tr><td colspan="6" class="text-center py-4">No hay pedidos recibidos.</td></tr>'}
              </table>
            </div>
          </div>`;
      } else if (vendorTab === 'settings') {
        tabContent = `
          <form class="card max-w-xl mx-auto space-y-3 text-left" onsubmit="saveVendorSettings(event)">
            <h3 class="disp text-xl font-bold">⚙️ Configuración del Stand</h3>
            <input class="inp text-sm" name="name" value="${h(stand.name)}" required>
            <input class="inp text-sm" name="rubro" value="${h(stand.rubro)}" required placeholder="Rubro">
            <input class="inp text-sm" name="phone" value="${h(stand.phone)}" required>
            <textarea class="inp text-sm" name="description" rows="3">${h(stand.description || '')}</textarea>
            
            <label class="block text-xs sm:text-sm font-bold">Logo del Emprendimiento:
              <input type="file" id="settingsLogo" accept="image/*" class="inp mt-1 text-xs bg-white">
            </label>
            ${stand.logo ? `<div class="w-16 h-16 rounded-full overflow-hidden bg-slate-100"><img src="${h(stand.logo)}" class="w-full h-full object-cover"></div>` : ''}

            <label class="block text-xs sm:text-sm font-bold">Color del Stand: <input type="color" name="color" value="${stand.color || '#ff5a36'}" class="ml-2 align-middle h-8 w-14 rounded cursor-pointer"></label>
            <div class="bg-slate-50 p-3 rounded-xl border flex items-center justify-between">
              <div>
                <b>Modo Vacaciones / Pausa</b>
                <p class="text-xs text-slate-500">Oculta temporalmente tu stand de la feria.</p>
              </div>
              <input type="checkbox" name="active" ${stand.active ? 'checked' : ''} class="w-5 h-5 accent-[#ff5a36]">
            </div>
            <button class="btn text-sm py-2.5" id="saveSettingsBtn">Guardar Cambios</button>
          </form>`;
      }

      return `
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
          <div class="flex items-center gap-3">
            ${stand.logo ? `<div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white overflow-hidden shadow flex items-center justify-center shrink-0"><img src="${h(stand.logo)}" class="w-full h-full object-cover"></div>` : ''}
            <h1 class="disp text-2xl sm:text-3xl font-extrabold truncate">⛺ ${h(stand.name)}</h1>
          </div>
          <div class="flex gap-1.5 w-full sm:w-auto overflow-x-auto pb-1">
            <button class="${vendorTab==='products'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="vendorTab='products'; route();">📦 Productos</button>
            <button class="${vendorTab==='orders'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="vendorTab='orders'; route();">🧾 Pedidos</button>
            <button class="${vendorTab==='settings'?'btn':'btn2'} text-xs sm:text-sm !py-2 shrink-0" onclick="vendorTab='settings'; route();">⚙️ Mi Stand</button>
          </div>
        </div>
        ${tabContent}`;
    }

    window.handleProdCategoryChange = val => {
      const container = $('#customProdCatContainer');
      const input = $('#customProdCatInput');
      if (!container || !input) return;
      if (val === 'Otro') {
        container.classList.remove('hidden');
        input.required = true;
      } else {
        container.classList.add('hidden');
        input.required = false;
        input.value = '';
      }
      renderDynamicSpecs(val, {});
    };

    window.renderDynamicSpecs = (category, existingSpecs = {}) => {
      const container = $('#dynamicSpecsContainer');
      if (!container) return;
      if (category === 'Ropa') {
        const sizes = existingSpecs.sizes || ['S', 'M', 'L', 'XL'];
        container.innerHTML = `<label class="block text-xs font-bold mb-1">Talles disponibles (Ropa):</label><div class="flex flex-wrap gap-2">${['S','M','L','XL','XXL'].map(s=>`<label class="text-xs"><input type="checkbox" name="size" value="${s}" ${sizes.includes(s)?'checked':''}> ${s}</label>`).join('')}</div>`;
      } else if (category === 'Calzado') {
        const sizes = existingSpecs.sizes || ['37', '38', '39', '40'];
        container.innerHTML = `<label class="block text-xs font-bold mb-1">Talles (Calzado 35-41):</label><div class="flex flex-wrap gap-2">${[35,36,37,38,39,40,41].map(s=>`<label class="text-xs"><input type="checkbox" name="size" value="${s}" ${sizes.includes(String(s))?'checked':''}> ${s}</label>`).join('')}</div>`;
      } else if (category === 'Manualidades') {
        container.innerHTML = `<input class="inp text-sm" name="measures" placeholder="Medidas (ej: 1 a 20 cm)" value="${h(existingSpecs.measures || '')}">`;
      } else {
        container.innerHTML = '';
      }
    };

    window.editProduct = id => {
      editingProdId = id;
      vendorTab = 'products';
      route();
      setTimeout(() => {
        const p = DB.getProducts().find(x => x.id === id);
        if (p) {
          const standardCats = ['Comida', 'Ropa', 'Calzado', 'Manualidades'];
          const catVal = standardCats.includes(p.category) ? p.category : 'Otro';
          const select = $('#prodCategorySelect');
          if (select) {
            select.value = catVal;
            handleProdCategoryChange(catVal);
          }
          if (catVal === 'Otro') {
            const customInput = $('#customProdCatInput');
            if (customInput) customInput.value = p.category;
          }
          renderDynamicSpecs(p.category, p.specs || {});
        }
      }, 50);
    };

    window.saveVendorProduct = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const btn = $('#saveProdBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Subiendo foto...'; }

      const fileInput = $('#prodImage');
      let imgUrl = editingProdId ? (DB.getProducts().find(p => p.id === editingProdId)?.image || '') : '';
      if (fileInput && fileInput.files[0]) {
        imgUrl = await uploadToCloudinary(fileInput.files[0]);
      }

      const finalCategory = f.categorySelect === 'Otro' ? (f.customCategory || 'General') : f.categorySelect;
      const sizes = Array.from(document.querySelectorAll('input[name="size"]:checked')).map(i => i.value);
      const specs = { sizes, measures: f.measures || '' };

      const products = DB.getProducts();
      if (editingProdId) {
        const idx = products.findIndex(p => p.id === editingProdId);
        if (idx !== -1) {
          products[idx] = { ...products[idx], name: f.name, category: finalCategory, price: Number(f.price), discount: Number(f.discount || 0), description: f.description, image: imgUrl, specs };
        }
      } else {
        products.push({ id: Date.now(), stand_id: currentVendor.id, name: f.name, category: finalCategory, price: Number(f.price), discount: Number(f.discount || 0), description: f.description, image: imgUrl, specs, active: true });
      }
      await DB.saveProducts(products);
      editingProdId = null;
      toast('Producto guardado con éxito');
      route();
    };

    window.deleteProduct = async id => {
      if (!confirm('¿Borrar este producto?')) return;
      await DB.removeProduct(id);
      toast('Producto eliminado');
      route();
    };

    window.applyMassPrice = async () => {
      const pct = Number($('#massPct').value);
      if (!pct) return toast('Ingresá un porcentaje válido.');
      const products = DB.getProducts();
      products.forEach(p => {
        if (p.stand_id === currentVendor.id) {
          p.price = Math.round(p.price * (1 + pct / 100));
        }
      });
      await DB.saveProducts(products);
      toast('¡Precios actualizados masivamente!');
      route();
    };

    window.toggleOrderStatus = async orderId => {
      const orders = DB.getOrders();
      const o = orders.find(x => x.id === orderId);
      if (o) {
        o.delivered = !o.delivered;
        await DB.saveOrders(orders);
        toast('Estado de entrega actualizado');
        route();
      }
    };

    window.saveVendorSettings = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const btn = $('#saveSettingsBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }

      const stands = DB.getStands();
      const idx = stands.findIndex(s => s.id === currentVendor.id);
      if (idx !== -1) {
        const fileInput = $('#settingsLogo');
        let logoUrl = stands[idx].logo || '';
        if (fileInput && fileInput.files[0]) {
          logoUrl = await uploadToCloudinary(fileInput.files[0]);
        }

        stands[idx].name = f.name;
        stands[idx].rubro = f.rubro;
        stands[idx].phone = f.phone;
        stands[idx].description = f.description;
        stands[idx].color = f.color;
        stands[idx].logo = logoUrl;
        stands[idx].active = f.active === 'on';
        await DB.saveStands(stands);
        currentVendor = stands[idx];
        localStorage.setItem('fv_session', JSON.stringify(currentVendor));
        toast('Configuración guardada');
        route();
      }
    };

    // --- ENRUTADOR PRINCIPAL ---
    window.route = async function() {
      const hash = location.hash || '#/';
      const [path, arg] = hash.replace(/^#\/?/, '').split('/');
      renderNav();
      try {
        let html = '';
        if (!path || path === '') html = await homeView();
        else if (path === 'stand') html = await standView(arg);
        else if (path === 'carrito') { toggleCart(true); return; }
        else if (path === 'checkout') html = checkoutView();
        else if (path === 'ingresar' || path === 'registro') html = authView(path === 'registro');
        else if (path === 'panel') html = await panelView();
        else if (path === 'admin') html = adminDashboardView();
        else html = await homeView();
        app.innerHTML = html;
      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="card text-center py-10"><h2 class="text-xl font-bold">Ups, ocurrió un error.</h2><button class="btn mt-4 max-w-xs mx-auto" onclick="navigate('#/')">Volver al inicio</button></div>`;
      }
      window.scrollTo(0, 0);
    };

    window.addEventListener('hashchange', window.route);
    window.addEventListener('DOMContentLoaded', () => {
      if (!location.hash) location.replace('#/');
      renderNav();
      window.route();
    });
  </script>
</body>
</html>
