<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feria Virtual · feriavirtual.shop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎪%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #e4f0f1; color: #10263a; overflow-x: hidden; }
    h1, h2, h3, .disp { font-family: 'Bricolage Grotesque', sans-serif; }
    .inp { width: 100%; border: 2px solid #c5d8dc; border-radius: 12px; padding: 10px 14px; background: #fff; font-size: 16px; }
    .inp:focus { outline: 3px solid #ff5a36; border-color: #ff5a36; }
    .btn { background: #ff5a36; color: #fff; font-weight: 700; border-radius: 12px; padding: 12px 18px; display: inline-block; text-align: center; cursor: pointer; border: none; transition: background .2s; width: 100%; }
    .btn:hover { background: #e84823; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn2 { background: #10263a; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px 14px; display: inline-block; text-align: center; cursor: pointer; border: none; }
    .btnwa { background: #1faa59; color: #fff; font-weight: 700; border-radius: 12px; padding: 12px 18px; display: inline-block; text-align: center; cursor: pointer; text-decoration: none; width: 100%; }
    .card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 4px 12px rgba(16,38,58,.06); width: 100%; box-sizing: border-box; }
    .stand-card { background: #fff; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 2px solid #e4f0f1; transition: all .2s; text-decoration: none; color: #10263a; }
    .stand-card:hover { border-color: #ff5a36; transform: translateY(-2px); }
    .zoom-container { overflow: hidden; position: relative; cursor: zoom-in; }
    .zoom-container img { transition: transform 0.3s ease; }
    .zoom-container.zoomed img { transform: scale(2); cursor: zoom-out; }
    .product-box { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: #ffffff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #e4f0f1; }
    .product-box img { width: 100%; height: 100%; object-fit: contain; object-position: center; transition: transform 0.3s ease; }
    .product-box:hover img { transform: scale(1.03); }
    @keyframes pulse-skeleton { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .skeleton { animation: pulse-skeleton 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: #cbd5e1; border-radius: 12px; }
  </style>

  <!-- FIREBASE FIRESTORE INTEGRACIÓN ROBUSTA CON MODO OFFLINE Y ESCRITURAS ATÓMICAS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQgmq6xVihzWN-f0LbzlzZrSecYeEnjs",
      authDomain: "feria-virtual-shop.firebaseapp.com",
      projectId: "feria-virtual-shop",
      storageBucket: "feria-virtual-shop.firebasestorage.app",
      messagingSenderId: "566189255248",
      appId: "1:566189255248:web:5a44efcol1e4cb8ad3c355"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let memoryStands = JSON.parse(localStorage.getItem('fv_cache_stands') || '[]');
    let memoryProducts = JSON.parse(localStorage.getItem('fv_cache_products') || '[]');
    let memoryOrders = JSON.parse(localStorage.getItem('fv_cache_orders') || '[]');
    let memoryReviews = JSON.parse(localStorage.getItem('fv_cache_reviews') || '[]');

    async function fetchCloudData() {
      try {
        const standsSnap = await getDocs(collection(db, 'stands'));
        memoryStands = standsSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_stands', JSON.stringify(memoryStands));

        const prodsSnap = await getDocs(collection(db, 'products'));
        memoryProducts = prodsSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_products', JSON.stringify(memoryProducts));

        const ordersSnap = await getDocs(collection(db, 'orders'));
        memoryOrders = ordersSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_orders', JSON.stringify(memoryOrders));

        const reviewsSnap = await getDocs(collection(db, 'reviews'));
        memoryReviews = reviewsSnap.docs.map(d => d.data());
        localStorage.setItem('fv_cache_reviews', JSON.stringify(memoryReviews));
      } catch (err) {
        console.warn("Modo offline activo:", err);
      }
      if (typeof window.route === 'function') window.route();
    }

    fetchCloudData();

    window.CloudDB = {
      getStands: () => memoryStands,
      saveStand: async (stand) => {
        const idx = memoryStands.findIndex(s => s.id === stand.id);
        if (idx >= 0) memoryStands[idx] = stand; else memoryStands.push(stand);
        localStorage.setItem('fv_cache_stands', JSON.stringify(memoryStands));
        await setDoc(doc(db, 'stands', String(stand.id)), stand);
      },
      removeStand: async (id) => {
        memoryStands = memoryStands.filter(s => s.id !== id);
        localStorage.setItem('fv_cache_stands', JSON.stringify(memoryStands));
        try { await deleteDoc(doc(db, 'stands', String(id))); } catch(e){}
      },
      getProducts: () => memoryProducts,
      saveProduct: async (prod) => {
        const idx = memoryProducts.findIndex(p => p.id === prod.id);
        if (idx >= 0) memoryProducts[idx] = prod; else memoryProducts.push(prod);
        localStorage.setItem('fv_cache_products', JSON.stringify(memoryProducts));
        await setDoc(doc(db, 'products', String(prod.id)), prod);
      },
      removeProduct: async (id) => {
        memoryProducts = memoryProducts.filter(p => p.id !== id);
        localStorage.setItem('fv_cache_products', JSON.stringify(memoryProducts));
        try { await deleteDoc(doc(db, 'products', String(id))); } catch(e){}
      },
      getOrders: () => memoryOrders,
      saveOrder: async (order) => {
        memoryOrders.push(order);
        localStorage.setItem('fv_cache_orders', JSON.stringify(memoryOrders));
        await setDoc(doc(db, 'orders', String(order.id)), order);
      },
      getReviews: () => memoryReviews,
      saveReview: async (review) => {
        if (!review.id) review.id = Date.now();
        memoryReviews.push(review);
        localStorage.setItem('fv_cache_reviews', JSON.stringify(memoryReviews));
        await setDoc(doc(db, 'reviews', String(review.id)), review);
      },
      removeReview: async (id) => {
        memoryReviews = memoryReviews.filter(r => r.id !== id);
        localStorage.setItem('fv_cache_reviews', JSON.stringify(memoryReviews));
        try { await deleteDoc(doc(db, 'reviews', String(id))); } catch(e){}
      },
      refresh: fetchCloudData
    };
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <main id="app" class="max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-1">

  <!-- Carrito Deslizante -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/50 hidden transition-opacity" onclick="toggleCart(false)">

        <button type="button" class="btn2 !px-3 !py-1 text-sm" onclick="toggleCart(false)">✕</button>

  <!-- Modal Zoom -->
  <div id="zoomModal" class="fixed inset-0 z-50 bg-black/85 hidden flex items-center justify-center p-4" onclick="closeZoom()">
    <div class="bg-white rounded-3xl p-5 max-w-lg w-full relative overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <button type="button" class="absolute top-3 right-3 bg-[#10263a] text-white rounded-full w-10 h-10 font-bold flex items-center justify-center text-lg shadow-lg z-20 hover:bg-[#ff5a36] transition-colors" onclick="closeZoom()">✕</button>

  <footer class="bg-[#10263a] text-white py-6 text-center text-xs sm:text-sm mt-12 px-4">

    <p class="text-slate-400 mt-1">Conectando emprendedores y compradores locales.</p>
    <a href="https://wa.me/5493794655867?text=Hola%20Walchu,%20necesito%20soporte%20con%20la%20Feria%20Virtual" target="_blank" class="inline-block mt-3 bg-white/10 px-3 py-1.5 rounded-full hover:bg-white/20">💬 Soporte Técnico con Walchu</a>
  </footer>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#10263a] text-white px-4 py-2 rounded-xl hidden z-50 max-w-[90vw] text-center shadow-lg text-sm"></div>

  <script>
    const ADMIN_WHATSAPP = '5493794655867';
    const CLOUD_NAME = 'xr6zpe1k';
    const UPLOAD_PRESET = 'feria_preset';

    const slugify = (str) => (str || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const cleanPhoneNumber = (raw) => {
      let digits = (raw || '').replace(/\D/g, '');
      if (digits.startsWith('549') && digits.length > 10) digits = digits.slice(3);
      else if (digits.startsWith('54') && digits.length > 10) digits = digits.slice(2);
      if (digits.startsWith('0')) digits = digits.slice(1);
      return digits;
    };

    const optimizeCloudinaryUrl = (url) => (!url || !url.includes('cloudinary.com')) ? url : url.replace('/upload/', '/upload/f_auto,q_auto/');

    const uploadToCloudinary = async (file) => {
      if (!file) return '';
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!data.secure_url) throw new Error('Falló la subida de imagen');
      return optimizeCloudinaryUrl(data.secure_url);
    };

    const DB = {
      getStands: () => window.CloudDB ? window.CloudDB.getStands() : [],
      saveStand: async s => { if(window.CloudDB) await window.CloudDB.saveStand(s); },
      removeStand: async id => { if(window.CloudDB) await window.CloudDB.removeStand(id); },
      getProducts: () => window.CloudDB ? window.CloudDB.getProducts() : [],
      saveProduct: async p => { if(window.CloudDB) await window.CloudDB.saveProduct(p); },
      removeProduct: async id => { if(window.CloudDB) await window.CloudDB.removeProduct(id); },
      getOrders: () => window.CloudDB ? window.CloudDB.getOrders() : [],
      saveOrder: async o => { if(window.CloudDB) await window.CloudDB.saveOrder(o); },
      getReviews: () => window.CloudDB ? window.CloudDB.getReviews() : [],
      saveReview: async r => { if(window.CloudDB) await window.CloudDB.saveReview(r); },
      removeReview: async id => { if(window.CloudDB) await window.CloudDB.removeReview(id); },
      refresh: () => { if(window.CloudDB) window.CloudDB.refresh(); }
    };

    const $ = s => document.querySelector(s);
    const app = $('#app');
    const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 2 });

    const parsePrice = (val) => {
      if (!val) return 0;
      let s = String(val).trim().replace(/\./g, '').replace(',', '.');
      let num = Number(s) || 0;
      if (num > 0 && num < 10) num *= 10000;
      else if (num >= 10 && num < 1000) num *= 1000;
      return num;
    };

    const finalPrice = p => Math.round(Number(p.price) * (1 - (Number(p.discount) || 0) / 100));
    const toast = m => {
      const t = $('#toast');
      t.textContent = m;
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
    };

    let cart = JSON.parse(localStorage.getItem('fv_cart') || '[]');
    let currentVendor = JSON.parse(localStorage.getItem('fv_session') || 'null');

    const saveCart = () => { localStorage.setItem('fv_cart', JSON.stringify(cart)); renderNav(); };

    function renderNav() {
      const totalItems = cart.reduce((acc, i) => acc + i.qty, 0);
      const totalPrice = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      $('#nav').innerHTML = `
        <button type="button" onclick="toggleCart(true)" class="px-2 py-1.5 rounded-xl bg-white/10 flex items-center gap-1 text-xs">
          🛒 (${totalItems}) <span class="hidden md:inline">${money(totalPrice)}</span>
        </button>` +
        (currentVendor 
          ? `<button type="button" onclick="navigate('#/panel')" class="px-3 py-1.5 rounded-xl bg-[#ff5a36] text-xs font-bold">Mi Stand</button>
             <button type="button" onclick="logout()" class="px-1 py-1.5 opacity-80 text-xs">Salir</button>`
          : `<button type="button" onclick="navigate('#/ingresar')" class="px-2 py-1.5 text-xs">Vendedor</button>
             <button type="button" onclick="navigate('#/registro')" class="px-3 py-1.5 rounded-xl bg-[#ff5a36] text-xs font-bold">Crear Stand</button>`);
    }

    window.navigate = hash => { location.hash = hash; };
    window.toggleCart = show => {
      const drawer = $('#cartDrawer');
      if (show) { renderCartDrawerContent(); drawer.classList.remove('hidden'); }
      else drawer.classList.add('hidden');
    };

    function renderCartDrawerContent() {
      const cdc = $('#cartDrawerContent');
      if (!cart.length) {
        cdc.innerHTML = `<div class="text-center py-12"><div class="text-5xl mb-2">🛒</div><p class="font-bold">Tu carrito está vacío</p><button class="btn mt-4" onclick="toggleCart(false); navigate('#/')">Ver stands</button></div>`;
        return;
      }
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      cdc.innerHTML = `
        <div class="space-y-3 flex-1 overflow-y-auto">
          ${cart.map((item, idx) => `
            <div class="flex items-center justify-between gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
              <div class="min-w-0 flex-1">
                <b class="text-sm block truncate">${h(item.name)}</b>
                <span class="text-xs text-slate-500">🏪 ${h(item.standName)} · ${money(item.price)} c/u</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button class="bg-slate-200 w-7 h-7 rounded font-bold" onclick="chgCartQty(${idx}, -1)">−</button>
                <span class="text-sm font-bold w-5 text-center">${item.qty}</span>
                <button class="bg-slate-200 w-7 h-7 rounded font-bold" onclick="chgCartQty(${idx}, 1)">+</button>
              </div>
            </div>`).join('')}
        </div>
        <div class="pt-4 border-t border-slate-200 mt-auto">
          <div class="flex justify-between items-center mb-4"><span class="font-bold text-base">Total</span><span class="disp text-xl font-extrabold text-[#ff5a36]">${money(total)}</span></div>
          <button class="btn text-base mb-2" onclick="toggleCart(false); navigate('#/checkout')">Iniciar Pedido</button>
          <button class="btn2 w-full text-sm !bg-slate-200 !text-[#10263a]" onclick="cart=[]; saveCart(); toggleCart(false); toast('Carrito vaciado');">Vaciar</button>
        </div>`;
    }

    window.chgCartQty = (idx, d) => {
      cart[idx].qty += d;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart();
      renderCartDrawerContent();
    };

    window.addToCart = (productId, standId, standName, name, price) => {
      const existing = cart.find(i => i.id === productId);
      if (existing) existing.qty++;
      else cart.push({ id: productId, standId, standName, name, price, qty: 1 });
      saveCart();
      toast('¡Agregado al carrito 🛒!');
      toggleCart(true);
    };

    window.openZoom = (imgUrl, name, desc) => {
      const optImg = optimizeCloudinaryUrl(imgUrl);
      $('#zoomContent').innerHTML = `
        <div class="zoom-container mb-3 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden h-56" onclick="this.classList.toggle('zoomed')">
          ${optImg ? `<img src="${h(optImg)}" loading="lazy" class="w-full h-full object-contain">` : '<span class="text-6xl">📦</span>'}
        </div>
        <h3 class="disp text-lg font-bold">${h(name)}</h3>
        <p class="text-sm text-slate-600 mt-1">${h(desc || 'Sin descripción.')}</p>`;
      $('#zoomModal').classList.remove('hidden');
    };
    window.closeZoom = () => $('#zoomModal').classList.add('hidden');

    window.adminLoginAsStand = id => {
      const s = DB.getStands().find(x => x.id === id);
      if (!s) return toast('Stand no encontrado');
      currentVendor = s;
      localStorage.setItem('fv_session', JSON.stringify(s));
      localStorage.setItem('fv_admin_impersonate', 'true');
      toast('Ingresando como ' + s.name);
      navigate('#/panel');
    };

    window.exitAdminAsStand = () => {
      localStorage.removeItem('fv_admin_impersonate');
      currentVendor = null;
      localStorage.removeItem('fv_session');
      navigate('#/admin');
    };

    async function homeView() {
      let stands = DB.getStands().filter(s => s.active).sort(() => Math.random() - 0.5);
      return `
        <section class="rounded-3xl bg-gradient-to-r from-amber-500 to-[#ff5a36] text-white p-5 mb-6 shadow-xl text-center">
          <div class="text-3xl mb-1">🚀 ¡LANZAMIENTO OFICIAL! 🚀</div>
          <h2 class="disp text-xl sm:text-2xl font-extrabold">¡Crear tu Stand en la Feria es 100% GRATIS!</h2>
          <button class="mt-3 bg-white text-[#10263a] font-bold px-5 py-2 rounded-xl text-sm shadow" onclick="navigate('#/registro')">Crear Stand Gratis</button>
        </section>
        <section class="rounded-3xl bg-[#10263a] text-white p-6 mb-6 shadow-xl">
          <h1 class="text-3xl font-extrabold">Feria Virtual 🎪</h1>
          <p class="mt-2 text-sm text-slate-300">Apoyá a los emprendedores locales. Elegí un stand y coordiná tu compra por WhatsApp.</p>
          <input id="searchInput" class="inp max-w-sm mt-4 !bg-white/10 !text-white placeholder:text-slate-400 !border-white/20 text-sm" placeholder="🔍 Buscar stand..." oninput="filterStands(this.value)">
        </section>
        <h2 class="text-xl font-extrabold mb-4">Stands Activos (${stands.length})</h2>
        <div id="standsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          ${stands.map(s => `
            <a class="stand-card" href="#/stand/${s.slug || s.id}">
              <div class="w-14 h-14 rounded-2xl bg-slate-100 overflow-hidden shrink-0 border" style="border-color:${h(s.color || '#ff5a36')}">
                ${s.logo ? `<img src="${h(optimizeCloudinaryUrl(s.logo))}" loading="lazy" class="w-full h-full object-cover">` : '<span class="text-2xl flex items-center justify-center h-full">⛺</span>'}
              </div>
              <div class="flex-1 min-w-0">
                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full text-white" style="background:${h(s.color || '#ff5a36')}">${h(s.rubro)}</span>
                <b class="disp text-base block truncate">${h(s.name)}</b>
                <p class="text-xs text-slate-500 truncate">${h(s.description || '')}</p>
              </div>
            </a>`).join('')}
        </div>`;
    }

    window.filterStands = q => {
      q = q.toLowerCase();
      const grid = $('#standsGrid');
      if (!grid) return;
      const stands = DB.getStands().filter(s => s.active && (s.name.toLowerCase().includes(q) || s.rubro.toLowerCase().includes(q)));
      grid.innerHTML = stands.map(s => `
        <a class="stand-card" href="#/stand/${s.slug || s.id}">
          <div class="w-14 h-14 rounded-2xl bg-slate-100 overflow-hidden shrink-0 border">
            ${s.logo ? `<img src="${h(optimizeCloudinaryUrl(s.logo))}" loading="lazy" class="w-full h-full object-cover">` : '⛺'}
          </div>
          <div class="flex-1 min-w-0">
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full text-white" style="background:${h(s.color || '#ff5a36')}">${h(s.rubro)}</span>
            <b class="disp text-base block truncate">${h(s.name)}</b>
            <p class="text-xs text-slate-500 truncate">${h(s.description || '')}</p>
          </div>
        </a>`).join('');
    };

    async function standView(id) {
      const stand = DB.getStands().find(s => String(s.id) === String(id) || s.slug === id);
      if (!stand || !stand.active) return `<div class="card text-center py-10"><h2 class="text-xl font-bold">Stand no disponible</h2><button class="btn mt-4 max-w-xs mx-auto" onclick="navigate('#/')">Volver</button></div>`;
      
      const products = DB.getProducts().filter(p => String(p.stand_id) === String(stand.id) && p.active);
      const reviews = DB.getReviews().filter(r => String(r.stand_id) === String(stand.id));
      const avgRating = reviews.length ? (reviews.reduce((a,b)=>a+b.rating,0)/reviews.length).toFixed(1) : 'Nuevo';

      return `
        <div class="rounded-3xl p-5 mb-6 text-white shadow-lg flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left" style="background:${h(stand.color || '#ff5a36')}">
          ${stand.logo ? `<div class="w-20 h-20 rounded-2xl bg-white overflow-hidden shadow shrink-0"><img src="${h(optimizeCloudinaryUrl(stand.logo))}" class="w-full h-full object-cover"></div>` : ''}
          <div class="flex-1 min-w-0">
            <button class="underline text-xs mb-2 font-bold block mx-auto sm:mx-0" onclick="navigate('#/')">← Volver</button>
            <h1 class="text-2xl sm:text-3xl font-extrabold">${h(stand.name)} <span class="text-[11px] bg-white/20 px-2.5 py-0.5 rounded-full uppercase">${h(stand.rubro)}</span></h1>
            <p class="opacity-90 text-xs sm:text-sm mt-1">${h(stand.description || '')}</p>
            <p class="text-xs mt-2">⭐ Reputación: <b>${avgRating}</b> (${reviews.length} opiniones)</p>
          </div>
          ${stand.phone ? `<a class="btnwa text-sm py-2 px-4 shrink-0" href="https://wa.me/${stand.phone}?text=${encodeURIComponent('Hola ' + stand.name + '! Vengo de la Feria Virtual.')}" target="_blank">💬 WhatsApp</a>` : ''}
        </div>

        <h2 class="text-xl font-extrabold mb-4">Productos</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          ${products.length ? products.map(p => {
            const finalP = finalPrice(p);
            const isAgotado = p.agotado || false;
            return `
              <div class="card !p-0 overflow-hidden flex flex-col justify-between shadow-md relative">
                ${isAgotado ? '<div class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center"><span class="bg-red-600 text-white font-bold px-3 py-1 rounded-full text-xs">AGOTADO</span></div>' : ''}
                <div class="product-box cursor-pointer" onclick="openZoom('${h(p.image)}', '${h(p.name)}', '${h(p.description)}')">
                  ${p.image ? `<img src="${h(optimizeCloudinaryUrl(p.image))}" loading="lazy" class="w-full h-full object-cover">` : '<div class="text-3xl">📦</div>'}
                </div>
                <div class="p-3 flex-1 flex flex-col">
                  <span class="text-[10px] text-slate-500 uppercase font-bold">${h(p.category)}</span>
                  <b class="text-sm leading-tight my-1 line-clamp-2">${h(p.name)}</b>
                  ${p.specs?.sizes ? `<p class="text-[11px] text-slate-600 mb-1"><b>Talles:</b> ${p.specs.sizes.join(', ')}</p>` : ''}
                  ${p.specs?.measures ? `<p class="text-[11px] text-slate-600 mb-1"><b>Medidas:</b> ${p.specs.measures}</p>` : ''}
                  ${p.specs?.gastronomy?.presentacion ? `<p class="text-[11px] text-slate-600 mb-1"><b>Presentación:</b> ${p.specs.gastronomy.presentacion}</p>` : ''}
                  <div class="mt-auto pt-2">
                    <b class="disp text-lg text-[#ff5a36]">${money(finalP)}</b>
                    <button class="btn w-full text-xs mt-1 !py-2 ${isAgotado ? 'opacity-50 cursor-not-allowed' : ''}" ${isAgotado ? 'disabled' : ''} onclick="addToCart(${p.id}, ${stand.id}, '${h(stand.name)}', '${h(p.name)}', ${finalP})">Agregar</button>
                  </div>
                </div>
              </div>`;
          }).join('') : '<p class="card col-span-full text-center py-8">Sin productos aún.</p>'}
        </div>

        <div class="card mt-8 max-w-xl mx-auto">
          <h3 class="disp text-lg font-bold mb-3">⭐ Opiniones (${reviews.length})</h3>
          <div class="space-y-3 mb-6 max-h-60 overflow-y-auto">
            ${reviews.length ? reviews.map(r => `
              <div class="bg-slate-50 p-3 rounded-xl border">
                <div class="flex justify-between text-xs font-bold"><span>${h(r.author)}</span><span>${'⭐'.repeat(r.rating)}</span></div>
                <p class="text-xs text-slate-600 mt-1">${h(r.comment)}</p>
                ${adminLogged ? `<button class="text-red-600 text-[10px] mt-1 underline" onclick="deleteReview(${r.id})">Moderación: Eliminar</button>` : ''}
              </div>`).join('') : '<p class="text-xs text-slate-500">Sé el primero en calificar.</p>'}
          </div>
          <form onsubmit="submitReview(event, ${stand.id})" class="space-y-3">
            <input class="inp text-sm" name="author" placeholder="Tu nombre" required>
            <select class="inp text-sm" name="rating" required>
              <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
              <option value="4">⭐⭐⭐⭐ Muy Bueno</option>
              <option value="3">⭐⭐⭐ Bueno</option>
              <option value="2">⭐⭐ Regular</option>
              <option value="1">⭐ Malo</option>
            </select>
            <textarea class="inp text-sm" name="comment" rows="2" placeholder="Tu opinión..." required></textarea>
            <button class="btn text-sm py-2">Enviar opinión</button>
          </form>
        </div>`;
    }

    window.submitReview = async (e, standId) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      await DB.saveReview({ stand_id: standId, author: f.author, rating: Number(f.rating), comment: f.comment, date: Date.now() });
      toast('¡Opinión enviada!');
      route();
    };

    window.deleteReview = async id => {
      if (!confirm('¿Eliminar opinión?')) return;
      await DB.removeReview(id);
      toast('Opinión eliminada');
      route();
    };

    function checkoutView() {
      if (!cart.length) return navigate('#/');
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      return `
        <div class="card max-w-xl mx-auto shadow-xl">
          <h1 class="disp text-2xl font-extrabold mb-4">Finalizar Pedido</h1>
          <form onsubmit="placeOrder(event)" class="space-y-4">
            <input class="inp text-sm" name="name" placeholder="Tu Nombre y Apellido" required>
            <input class="inp text-sm" name="phone" type="tel" placeholder="Tu WhatsApp (ej: 379...)" required>
            <textarea class="inp text-sm" name="notes" rows="3" placeholder="Notas de entrega..."></textarea>
            <div class="bg-slate-50 p-4 rounded-xl border flex justify-between items-center">
              <span class="font-bold">Total</span><span class="disp text-2xl font-extrabold text-[#ff5a36]">${money(total)}</span>
            </div>
            <button class="btn text-base py-3">Confirmar Pedido</button>
          </form>
        </div>`;
    }

    window.placeOrder = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const orderId = Date.now().toString().slice(-6);
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

      const byStand = {};
      cart.forEach(i => {
        byStand[i.standId] = byStand[i.standId] || { name: i.standName, phone: '', items: [] };
        byStand[i.standId].items.push(i);
      });
      Object.keys(byStand).forEach(id => {
        const s = DB.getStands().find(x => x.id === Number(id));
        if (s) byStand[id].phone = s.phone;
      });

      await DB.saveOrder({ id: orderId, buyer: f, cart: [...cart], total, date: Date.now() });
      cart = [];
      saveCart();

      let standsHtml = Object.keys(byStand).map(id => {
        const st = byStand[id];
        const t = st.items.reduce((a, b) => a + (b.price * b.qty), 0);
        const txt = `Hola ${st.name}! Soy ${f.name}. Pedido #${orderId}:
` + st.items.map(i => `• ${i.qty}x ${i.name}`).join('
') + `
Total: ${money(t)}`;
        return `<div class="bg-slate-50 p-4 rounded-xl border space-y-2"><b>🏪 ${h(st.name)}</b><a href="https://wa.me/${st.phone}?text=${encodeURIComponent(txt)}" target="_blank" class="btnwa text-sm block text-center">💬 Enviar WhatsApp</a></div>`;
      }).join('');

      app.innerHTML = `
        <div class="card max-w-lg mx-auto text-center py-8 space-y-4 shadow-xl">
          <div class="text-5xl">🎉</div>
          <h1 class="disp text-2xl font-extrabold">¡Pedido #${orderId} Registrado!</h1>
          <div class="space-y-3">${standsHtml}</div>
          <button class="btn2 w-full mt-4" onclick="navigate('#/')">Volver al Inicio</button>
        </div>`;
    };

    function authView(isReg) {
      return `
        <form class="card max-w-xl mx-auto space-y-4 shadow-xl text-left" onsubmit="handleAuth(event, ${isReg})">
          <h1 class="disp text-xl font-extrabold text-center">${isReg ? 'Crear Stand' : 'Ingresar como Vendedor'}</h1>
          ${isReg ? `
            <input class="inp text-sm" name="name" placeholder="Nombre de tu Emprendimiento" required>
            <select class="inp text-sm" name="rubro" required>
              <option value="">Rubro...</option>
              <option value="Comida">Comida</option>
              <option value="Ropa">Ropa</option>
              <option value="Calzado">Calzado</option>
              <option value="Perfumeria">Perfumería</option>
              <option value="Manualidades">Manualidades</option>
            </select>
            <input class="inp text-sm" name="phone" type="tel" placeholder="WhatsApp (ej: 379...)" required>
            <textarea class="inp text-sm" name="description" rows="2" placeholder="Descripción..."></textarea>
            <label class="block text-xs font-bold">Logo: <input type="file" id="logoFile" accept="image/*" class="inp mt-1 text-xs bg-white"></label>` : ''}
          <input class="inp text-sm" name="email" type="email" placeholder="Correo" required>
          <input class="inp text-sm" name="password" type="password" placeholder="Contraseña" required minlength="6">
          <button class="btn text-base py-3" id="submitAuthBtn">${isReg ? 'Registrar Stand' : 'Ingresar'}</button>
          <button type="button" class="w-full text-center text-xs underline text-slate-600" onclick="navigate('#/${isReg ? 'ingresar' : 'registro'}')">${isReg ? '¿Ya tenés stand? Ingresá' : '¿Querés crear tu stand?'}</button>
        </form>`;
    }

    window.handleAuth = async (e, isReg) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const btn = $('#submitAuthBtn');
      if (isReg) {
        btn.disabled = true; btn.textContent = 'Creando...';
        try {
          const logoInput = $('#logoFile');
          let logoUrl = logoInput?.files[0] ? await uploadToCloudinary(logoInput.files[0]) : '';
          const newStand = { id: Date.now(), name: f.name, rubro: f.rubro, phone: cleanPhoneNumber(f.phone), description: f.description, email: f.email, password: f.password, color: '#ff5a36', active: false, logo: logoUrl, created: Date.now() };
          await DB.saveStand(newStand);
          window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent('Hola Walchu! Registré mi stand ' + f.name)}`, '_blank');
          app.innerHTML = `<div class="card max-w-lg mx-auto text-center py-10"><h1 class="text-2xl font-bold">¡Stand Creado!</h1><p class="text-sm my-2">Pendiente de aprobación.</p><button class="btn max-w-xs mx-auto" onclick="navigate('#/')">Volver</button></div>`;
        } catch(err) {
          toast('Error al crear stand'); btn.disabled = false; btn.textContent = 'Registrar Stand';
        }
      } else {
        const stand = DB.getStands().find(s => s.email === f.email && s.password === f.password);
        if (!stand) return toast('Datos incorrectos');
        currentVendor = stand;
        localStorage.setItem('fv_session', JSON.stringify(stand));
        renderNav();
        navigate('#/panel');
      }
    };

    window.logout = () => { currentVendor = null; localStorage.removeItem('fv_session'); renderNav(); navigate('#/'); };

    let adminLogged = localStorage.getItem('fv_admin_logged') === 'true';
    let adminTab = 'stands';

    function adminDashboardView() {
      if (!adminLogged) return `<form class="card max-w-md mx-auto space-y-4 shadow-xl mt-6" onsubmit="handleAdminLogin(event)"><h1 class="disp text-xl font-bold text-center">🔒 Superadministrador</h1><input class="inp text-sm" name="user" placeholder="Usuario" required><input class="inp text-sm" name="pass" type="password" placeholder="Contraseña" required><button class="btn">Ingresar</button></form>`;
      const stands = DB.getStands();
      const products = DB.getProducts();
      return `
        <div class="flex justify-between items-center mb-4"><h1 class="disp text-2xl font-extrabold">🔒 Superadmin</h1><button class="btn2 text-xs py-1 px-3" onclick="adminLogged=false;localStorage.removeItem('fv_admin_logged');route();">Cerrar</button></div>
        <div class="card overflow-x-auto text-left">
          <h3 class="disp text-lg font-bold mb-3">Stands (${stands.length})</h3>
          <table class="w-full text-xs sm:text-sm min-w-[600px]">
            <tr><th>Negocio</th><th>Rubro</th><th>Productos</th><th>Estado</th><th>Acciones</th></tr>
            ${stands.map(s => {
              const sp = products.filter(p => String(p.stand_id) === String(s.id));
              return `<tr><td><b>${h(s.name)}</b></td><td>${h(s.rubro)}</td><td>${sp.length}</td><td>${s.active?'Activo':'Pendiente'}</td><td><button class="btn2 !py-1 !px-2 text-xs" onclick="toggleStandActive(${s.id})">${s.active?'Pausar':'Aprobar'}</button> <button class="bg-amber-600 text-white !py-1 !px-2 rounded text-xs" onclick="adminLoginAsStand(${s.id})">Entrar</button></td></tr>`;
            }).join('')}
          </table>
        </div>`;
    }

    window.handleAdminLogin = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (f.user === 'walchu86' && f.pass === 'pancha2026') { adminLogged = true; localStorage.setItem('fv_admin_logged', 'true'); route(); }
      else toast('Datos incorrectos');
    };

    window.toggleStandActive = async id => {
      const s = DB.getStands().find(x => x.id === id);
      if (s) { s.active = !s.active; await DB.saveStand(s); toast('Estado actualizado'); route(); }
    };

    let vendorTab = 'products';
    let editingProdId = null;

    async function panelView() {
      if (!currentVendor) return navigate('#/ingresar');
      const stand = DB.getStands().find(s => s.id === currentVendor.id) || currentVendor;
      const products = DB.getProducts().filter(p => String(p.stand_id) === String(stand.id));
      if (!stand.active) return `<div class="card text-center py-10"><h1 class="text-2xl font-bold">Stand Pendiente de Activación</h1><button class="btn max-w-xs mx-auto mt-4" onclick="logout()">Salir</button></div>`;

      const editingP = products.find(p => p.id === editingProdId) || {};

      return `
        <div class="flex justify-between items-center mb-6"><h1 class="disp text-2xl font-extrabold">⛺ ${h(stand.name)}</h1></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <form class="card space-y-3 md:col-span-1 h-fit text-left" onsubmit="saveVendorProduct(event)">
            <h3 class="disp text-lg font-bold">${editingP.id ? '✏️ Editar' : '➕ Nuevo Producto'}</h3>
            <input class="inp text-sm" name="name" placeholder="Nombre" value="${h(editingP.name || '')}" required>
            <select class="inp text-sm" name="category" required onchange="renderDynamicSpecs(this.value)">
              <option value="">Categoría...</option>
              ${['Comida','Ropa','Calzado','Perfumeria','Manualidades'].map(c=>`<option value="${c}" ${editingP.category===c?'selected':''}>${c}</option>`).join('')}
            </select>
            <div id="dynamicSpecsContainer"></div>
            <input class="inp text-sm" name="price" type="text" placeholder="Precio ($)" value="${editingP.price || ''}" required oninput="previewPrice(this.value)">
            <p id="pricePreview" class="text-xs text-slate-500 font-bold"></p>
            <input class="inp text-sm" name="discount" type="number" placeholder="% Descuento" value="${editingP.discount || ''}" min="0" max="95">
            <label class="block text-xs font-bold flex items-center gap-2"><input type="checkbox" name="agotado" ${editingP.agotado?'checked':''}> Marcar como Agotado</label>
            <textarea class="inp text-sm" name="description" rows="2" placeholder="Descripción...">${h(editingP.description || '')}</textarea>
            <label class="block text-xs font-bold">Foto: <input type="file" id="prodImage" accept="image/*" class="inp mt-1 text-xs bg-white"></label>
            <button class="btn text-sm py-2.5" id="saveProdBtn">${editingP.id ? 'Guardar Cambios' : 'Publicar Producto'}</button>
            ${editingP.id ? `<button type="button" class="btn2 w-full !bg-slate-300 !text-black text-sm mt-1" onclick="editingProdId=null;route();">Cancelar</button>` : ''}
          </form>

          <div class="md:col-span-2 space-y-4">
            <h3 class="disp text-xl font-bold">Tus Productos (${products.length})</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${products.map(p => `
                <div class="card !p-3 flex gap-3 items-center">
                  <div class="w-16 h-16 bg-slate-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center">
                    ${p.image ? `<img src="${h(optimizeCloudinaryUrl(p.image))}" loading="lazy" class="w-full h-full object-cover">` : '📦'}
                  </div>
                  <div class="flex-1 min-w-0">
                    <b class="text-sm truncate block">${h(p.name)} ${p.agotado?'<span class="text-red-500 text-[10px]">(Agotado)</span>':''}</b>
                    <span class="disp text-[#ff5a36] font-bold text-sm">${money(finalPrice(p))}</span>
                    <div class="flex gap-3 text-xs mt-1">
                      <button class="underline text-blue-600" onclick="editProduct(${p.id})">Editar</button>
                      <button class="underline text-red-600" onclick="deleteProduct(${p.id})">Borrar</button>
                    </div>
                  </div>
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    window.previewPrice = val => {
      const p = parsePrice(val);
      const prev = $('#pricePreview');
      if (prev) prev.textContent = p > 0 ? `Se publicará a: ${money(p)}` : '';
    };

    window.renderDynamicSpecs = (category, specs = {}) => {
      const c = $('#dynamicSpecsContainer');
      if (!c) return;
      if (category === 'Comida') {
        c.innerHTML = `<input class="inp text-xs" name="presentacion" placeholder="Presentación (ej: x 6)" value="${h(specs.gastronomy?.presentacion || '')}">`;
      } else if (category === 'Ropa' || category === 'Calzado') {
        c.innerHTML = `<input class="inp text-xs" name="sizes" placeholder="Talles (ej: S, M, L o 37, 38)" value="${h(specs.sizes ? specs.sizes.join(', ') : '')}">`;
      } else {
        c.innerHTML = `<input class="inp text-xs" name="measures" placeholder="Medidas (ej: 10x20 cm)" value="${h(specs.measures || '')}">`;
      }
    };

    window.editProduct = id => {
      editingProdId = id;
      route();
      setTimeout(() => {
        const p = DB.getProducts().find(x => x.id === id);
        if (p) {
          const sel = $('select[name="category"]');
          if (sel) { sel.value = p.category; renderDynamicSpecs(p.category, p.specs || {}); }
          previewPrice(String(p.price));
        }
      }, 50);
    };

    window.saveVendorProduct = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      const btn = $('#saveProdBtn');
      btn.disabled = true; btn.textContent = 'Guardando...';

      try {
        const fileInput = $('#prodImage');
        let imgUrl = editingProdId ? (DB.getProducts().find(p => p.id === editingProdId)?.image || '') : '';
        if (fileInput && fileInput.files[0]) {
          imgUrl = await uploadToCloudinary(fileInput.files[0]);
        }

        const specs = {};
        if (f.presentacion) specs.gastronomy = { presentacion: f.presentacion };
        if (f.sizes) specs.sizes = f.sizes.split(',').map(s => s.trim());
        if (f.measures) specs.measures = f.measures;

        const prod = {
          id: editingProdId || Date.now(),
          stand_id: currentVendor.id,
          name: f.name,
          category: f.category,
          price: parsePrice(f.price),
          discount: Number(f.discount || 0),
          agotado: f.agotado === 'on',
          description: f.description,
          image: imgUrl,
          specs,
          active: true
        };

        await DB.saveProduct(prod);
        editingProdId = null;
        toast('¡Guardado con éxito!');
        route();
      } catch(err) {
        toast('Error al guardar o subir foto. Intentá de nuevo.');
        btn.disabled = false; btn.textContent = editingProdId ? 'Guardar Cambios' : 'Publicar Producto';
      }
    };

    window.deleteProduct = async id => {
      if (!confirm('¿Borrar producto?')) return;
      await DB.removeProduct(id);
      toast('Producto eliminado');
      route();
    };

    window.route = async () => {
      const hash = location.hash || '#/';
      const [path, arg] = hash.replace(/^#\/?/, '').split('/');
      renderNav();
      try {
        if (!path) app.innerHTML = await homeView();
        else if (path === 'stand') app.innerHTML = await standView(arg);
        else if (path === 'checkout') app.innerHTML = checkoutView();
        else if (path === 'ingresar' || path === 'registro') app.innerHTML = authView(path === 'registro');
        else if (path === 'panel') app.innerHTML = await panelView();
        else if (path === 'admin') app.innerHTML = adminDashboardView();
        else app.innerHTML = await homeView();
      } catch(err) {
        app.innerHTML = `<div class="card text-center py-10">Ocurrió un error.</div>`;
      }
      window.scrollTo(0, 0);
    };

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', () => { if (!location.hash) location.replace('#/'); route(); });
  </script>
</body>
</html>
